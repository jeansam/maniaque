  en: “The technician turned up without the part.”
  pt: “O técnico chegou sem a peça.”
usesP3:
  fr: Qui va où, quand, avec quoi. Chaque intervention arrive sur le téléphone du bon technicien, avec l'adresse, l'historique et le matériel à prévoir.
  en: Who goes where, when, with what. Each job lands on the right technician's phone, with the address, the history and the parts to bring.
  pt: Quem vai aonde, quando e com o quê. Cada atendimento chega ao celular do técnico certo, com o endereço, o histórico e o material necessário.
