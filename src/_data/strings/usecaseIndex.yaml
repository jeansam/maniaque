title:
  fr: Cas d'usage
  en: Use cases
  pt: Casos de uso
description:
  fr: "CRM, devis, planning, stock, espace client, tableaux de bord : les outils sur mesure les plus plébiscités par les PME, et ce qu'ils changent au quotidien."
  en: "CRM, quotes, scheduling, inventory, customer portal, dashboards: the most popular custom tools for small businesses, and what they change day to day."
  pt: "CRM, orçamentos, agenda, estoque, área do cliente, dashboards: as ferramentas sob medida mais pedidas pelas PMEs, e o que elas mudam no dia a dia."
uses:
  fr: Chaque métier a ses manies. Votre outil aussi.
  en: Every trade has its quirks. So does your tool.
  pt: Cada negócio tem as suas manias. A sua ferramenta também.
usesSectionLede:
  fr: Voici les outils les plus plébiscités. Chacun est construit autour de votre façon de travailler, pas l'inverse, et peut commencer petit, puis grandir demande après demande.
  en: These are the most popular tools. Each one is built around the way you work, not the other way round, and can start small, then grow one request at a time.
  pt: Estas são as ferramentas mais pedidas. Cada uma é construída em torno da sua forma de trabalhar, e não o contrário, e pode começar pequena e crescer pedido após pedido.
usesLink:
  fr: Voir l'exemple →
  en: See the example →
  pt: Ver o exemplo →
usesMore:
  fr: "Le vôtre n'est pas dans la liste ? Tant mieux : le sur mesure, c'est justement ça."
  en: "Yours isn't on the list? Good: that's exactly what custom means."
  pt: "O seu não está na lista? Melhor ainda: sob medida é exatamente isso."
audit:
  fr: Parlons de ce qui vous agace au quotidien.
  en: Let's talk about what bugs you every day.
  pt: Vamos falar do que irrita você no dia a dia.
auditP:
  fr: 45 minutes, gratuites et sans engagement. Vous repartez avec un avis franc, même si c'est pour nous dire non.
  en: 45 minutes, free and with no commitment. You leave with an honest opinion, even if it's to tell you no.
  pt: 45 minutos, gratuitos e sem compromisso. Você sai com uma opinião franca, mesmo que seja para nos dizer não.
auditBtn:
  fr: Choisir un créneau
  en: Pick a time slot
  pt: Escolher um horário
