title:
  fr: Cas d'usage
  en: Use cases
  pt: Casos de uso
description:
  fr: 'CRM, devis, planning, stock, espace client, tableaux de bord : les outils sur mesure les plus plébiscités par les PME, et ce qu''ils changent au quotidien.'
  en: 'CRM, quotes, scheduling, inventory, customer portal, dashboards: the most popular custom tools for small businesses, and what they change day to day.'
  pt: 'CRM, orçamentos, agenda, estoque, área do cliente, dashboards: as ferramentas sob medida mais pedidas pelas PMEs, e o que elas mudam no dia a dia.'
uses:
  fr: Chaque métier a ses manies. Votre outil aussi.
  en: Every trade has its quirks. So does your tool.
  pt: Cada negócio tem as suas manias. A sua ferramenta também.
usesSectionLede:
  fr: Voici les outils les plus plébiscités. Chacun est construit autour de votre façon de travailler, pas l'inverse, et peut commencer petit, puis grandir demande après demande.
  en: These are the most popular tools. Each one is built around the way you work, not the other way round, and can start small, then grow one request at a time.
  pt: Estas são as ferramentas mais pedidas. Cada uma é construída em torno da sua forma de trabalhar, e não o contrário, e pode começar pequena e crescer pedido após pedido.
usesQuote:
  fr: «&nbsp;Qui devait rappeler le garage Leroy&nbsp;?&nbsp;»
  en: “Who was supposed to call Leroy Garage back?”
  pt: “Quem tinha que ligar de volta para a oficina Leroy?”
usesP:
  fr: 'Vos contacts, vos affaires et vos relances au même endroit, rangés comme vous vendez. Pas de licence par utilisateur : toute l''équipe y a accès.'
  en: 'Your contacts, deals and follow-ups in one place, organised the way you sell. No per-user licences: the whole team gets access.'
  pt: 'Seus contatos, seus negócios e seus follow-ups no mesmo lugar, organizados do jeito que você vende. Sem licença por usuário: a equipe toda tem acesso.'
usesLink:
  fr: Voir l'exemple →
  en: See the example →
  pt: Ver o exemplo →
usesH2:
  fr: Devis et chiffrages
  en: Quotes and estimates
  pt: Orçamentos
usesQuote2:
  fr: «&nbsp;Il me faut deux heures par devis.&nbsp;»
  en: “Every quote takes me two hours.”
  pt: “Eu levo duas horas para fazer um orçamento.”
usesP2:
  fr: Vos tarifs, vos marges et vos options sont déjà enregistrés. Le devis se monte en quelques minutes et part au bon format.
  en: Your rates, margins and options are already stored. A quote comes together in minutes and goes out in the right format.
  pt: Seus preços, suas margens e suas opções já estão cadastrados. O orçamento fica pronto em poucos minutos e sai no formato certo.
