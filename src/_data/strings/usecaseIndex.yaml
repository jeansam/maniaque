  pt: “Espero o fim do mês para saber se estamos ganhando dinheiro.”
usesP6:
  fr: 'Chiffre d''affaires, marges, carnet de commandes : vos chiffres à jour chaque matin, sans tableur à consolider.'
  en: 'Revenue, margins, order book: your figures up to date every morning, with no spreadsheet to pull together.'
  pt: 'Faturamento, margens, carteira de pedidos: os seus números atualizados toda manhã, sem planilha para consolidar.'
