founderP:
  fr: 'Depuis 2019, Jean-Samuel Jéquier crée des applications pour des entrepreneurs comme pour des grands groupes : une centaine au total, dans le tourisme, le monde associatif, le commerce, le médical, la fintech, la comptabilité, et bien d''autres secteurs.'
  en: 'Since 2019, Jean-Samuel Jéquier has been building applications for entrepreneurs and large companies alike: about a hundred in total, in tourism, non-profits, retail, healthcare, fintech, accounting and many other industries.'
  pt: 'Desde 2019, Jean-Samuel Jéquier cria aplicativos tanto para empreendedores quanto para grandes empresas: cerca de cem no total, em turismo, terceiro setor, comércio, saúde, fintech, contabilidade e muitos outros setores.'
founderP2:
  fr: 'Il a fondé Maniaque parce que l''IA permet enfin d''offrir ce niveau de sur-mesure à toutes les entreprises, pas seulement aux plus grandes. Ce qui ne change pas : quelqu''un qui écoute, qui répond et qui tient ses dates.'
  en: 'He founded Maniaque because AI finally makes this level of custom software affordable for every business, not just the biggest ones. What doesn''t change: someone who listens, answers and meets their deadlines.'
  pt: 'Ele fundou a Maniaque porque a IA finalmente permite oferecer esse nível de personalização a todas as empresas, não só às maiores. O que não muda: alguém que escuta, que responde e que cumpre os prazos.'
