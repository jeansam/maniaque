      en: Before Maniaque, he worked at companies such as <a class="inline-link" href="https://www.airbus.com" target="_blank" rel="noopener">Airbus</a> and <a class="inline-link" href="https://www.airdev.co" target="_blank" rel="noopener">Airdev</a>.
      pt: Antes da Maniaque, ele trabalhou, entre outras, na <a class="inline-link" href="https://www.airbus.com" target="_blank" rel="noopener">Airbus</a> e na <a class="inline-link" href="https://www.airdev.co" target="_blank" rel="noopener">Airdev</a>.
