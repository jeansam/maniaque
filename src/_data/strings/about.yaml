    - fr: "Maniaque n'est pas une agence. C'est un réseau de partenaires Produit et IA qui partagent leurs ressources et leurs bonnes pratiques à l'ère de l'IA, mais chaque partenaire a ses propres clients. Ainsi, les clients ne paient aucun des coûts d'une agence."
      en: "Maniaque is not an agency. It's a network of Product and AI partners who share resources and best practices with each other in the age of AI, but each partner has their own clients. This way, customers don't pay for any of the costs of an agency."
      pt: "A Maniaque não é uma agência. É uma rede de parceiros de Produto e IA que compartilham recursos e boas práticas entre si na era da IA, mas cada parceiro tem os seus próprios clientes. Assim, os clientes não pagam nenhum dos custos de uma agência."
