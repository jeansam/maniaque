founderP3:
  fr: 'À São Paulo, c''est Eliakim Oliveira qui vous répond : la personne qui vous écoute est aussi celle qui construit votre outil et s''engage sur les dates.'
  en: 'In São Paulo, Eliakim Oliveira is the one who answers you: the person who listens to you is also the one who builds your tool and commits to the dates.'
  pt: 'Em São Paulo, quem responde a você é Eliakim Oliveira: a pessoa que escuta você é a mesma que constrói a sua ferramenta e se compromete com os prazos.'
founderP4:
  fr: 'La méthode Maniaque : l''IA écrit le code, vite, et quelqu''un reste responsable du résultat, de l''audit à chaque livraison.'
  en: 'The Maniaque way: AI writes the code, fast, and someone stays accountable for the result, from the audit to every delivery.'
  pt: 'O método Maniaque: a IA escreve o código, rápido, e alguém continua responsável pelo resultado, do diagnóstico a cada entrega.'
