        pt: Sem fidelidade, cancelável a qualquer mês, ou migração para um plano só de manutenção por <span data-price="maintenance"></span> por mês sem impostos, hospedagem não incluída
      - fr: Sans engagement, résiliable chaque mois, ou basculement sur une offre de maintenance seule à <span data-price="maintenance"></span>&nbsp;HT par mois, hors hébergement
        en: No commitment, cancel any month, or switch to a maintenance-only plan at <span data-price="maintenance"></span> excl. VAT per month, hosting not included
        pt: Sem fidelidade, cancelável a qualquer mês, ou migração para um plano só de manutenção por <span data-price="maintenance"></span> por mês sem impostos, hospedagem não incluída
notes:
  - id: paiement
    title:
      fr: Conditions de paiement
      en: Payment terms
      pt: Condições de pagamento
    text:
      fr: Prix hors taxes. La première version se règle moitié à la commande, moitié à la mise en service. L'abonnement est prélevé en début de mois.
      en: Prices exclude VAT. The first version is paid half on order, half on go-live. The subscription is charged by direct debit at the start of each month.
      pt: Preços sem impostos. A primeira versão é paga metade na contratação e metade na entrada em produção. A assinatura é cobrada no início de cada mês.
  - id: hebergement
    title:
      fr: Hébergement
      en: Hosting
      pt: Hospedagem
    text:
      fr: votre outil est hébergé par nos soins ou par vos soins, selon votre préférence. Si nous l'hébergeons, nous pouvons vous donner la propriété du code à tout moment.
      en: your tool is hosted by us or by you, whichever you prefer. If we host it, we can hand over ownership of the code at any time.
      pt: sua ferramenta é hospedada por nós ou por você, como preferir. Se nós hospedarmos, podemos transferir a propriedade do código para você a qualquer momento.
  - id: usage
    title:
      fr: Services payants à l'usage
      en: Pay-per-use services
      pt: Serviços pagos por uso
    text:
      fr: "(SMS, emails en grand volume, intelligence artificielle pour des fonctionnalités de votre outil, comptes développeur Apple et Android pour une app native...) : refacturés au coût réel, sans marge."
      en: "(text messages, high-volume emails, artificial intelligence for features of your tool, Apple and Android developer accounts for a native app...): passed on at cost, with no markup."
      pt: "(SMS, e-mails em grande volume, inteligência artificial para funcionalidades da sua ferramenta, contas de desenvolvedor Apple e Android para um app nativo...): repassados pelo custo real, sem margem."
    sep: " "
commitmentsAnchor:
  fr: engagements
  en: commitments
  pt: engagements
commitmentsTitle:
  fr: L'IA écrit le code. Nous, on tient parole.
  en: AI writes the code. We keep our word.
  pt: A IA escreve o código. Nós cumprimos a palavra.
commitmentsText:
  fr: Il y a de l'IA dans man<span class="ia">ia</span>que. Elle écrit le code, vite. Ce qui reste rare, c'est quelqu'un qui répond, qui prévient et qui livre à la date dite. C'est ça que vous payez.
  en: There's AI in man<span class="ia">ia</span>que (in French, AI is “IA”). It writes the code, fast. What's still rare is someone who answers, keeps you posted and delivers on the date they gave you. That's what you're paying for.
  pt: Tem IA em man<span class="ia">ia</span>que. Ela escreve o código, rápido. O que continua raro é alguém que responde, que avisa e que entrega na data combinada. É isso que você paga.
promises:
  - fr: <strong>Un seul interlocuteur.</strong> La personne qui vous répond est celle qui construit votre outil. <a class="inline-link" href="/articles/developpeur-ninja-ia/">Pourquoi c'est plus efficace</a>
    en: <strong>One point of contact.</strong> The person who answers you is the person building your tool. <a class="inline-link" href="/en/articles/one-person-developer-ai/">Why it works better</a>
    pt: <strong>Um único interlocutor.</strong> A pessoa que responde a você é a mesma que constrói a sua ferramenta. <a class="inline-link" href="/pt/artigos/desenvolvedor-unico-ia/">Por que isso é mais eficiente</a>
  - fr: <strong>Réponse sous 24&nbsp;h ouvrées.</strong> À chaque message, même si c'est pour vous donner une date le lendemain.
    en: <strong>A reply within 24 business hours.</strong> To every message, even if it's just to give you a date the next day.
    pt: <strong>Resposta em até 24&nbsp;h úteis.</strong> Em cada mensagem, mesmo que seja para lhe dar uma data no dia seguinte.
  - fr: "<strong>Bugs et retouches sous 2&nbsp;heures.</strong> Quelque chose ne marche pas, ou un détail est à changer : c'est fait dans les 2&nbsp;heures ouvrées."
    en: "<strong>Bugs and tweaks within 2 hours.</strong> Something's broken or a detail needs changing: it's done within 2 business hours."
    pt: "<strong>Bugs e ajustes em até 2&nbsp;horas.</strong> Algo não funciona, ou um detalhe precisa mudar: fica pronto em até 2&nbsp;horas úteis."
  - fr: <strong>Nouvelles fonctionnalités selon leur taille.</strong> Chacune est testée à fond avant d'être mise en ligne. Vous connaissez la date à l'avance, et les gros projets sont découpés en étapes.
    en: <strong>New features based on their size.</strong> Each one is fully tested before going live. You know the date in advance, and big projects are split into steps.
    pt: <strong>Novas funcionalidades conforme o tamanho.</strong> Cada uma é testada a fundo antes de entrar no ar. Você sabe a data com antecedência, e os projetos grandes são divididos em etapas.
  - fr: <strong>Un point par mois.</strong> Un compte rendu écrit, reçu dans les trois jours avant 30 minutes ensemble pour fixer les priorités.
    en: <strong>A monthly check-in.</strong> A written report, sent within the three days before a 30-minute call to set priorities.
    pt: <strong>Uma reunião por mês.</strong> Um relatório escrito, recebido três dias antes de 30 minutos juntos para definir as prioridades.
guarantee:
  title:
    fr: Notre garantie
    en: Our guarantee
    pt: Nossa garantia
  text:
    fr: Si on rate une date qu'on vous a donnée, le mois suivant est à moitié prix.
    en: If we miss a date we gave you, the next month is half price.
    pt: Se perdermos uma data que demos a você, o mês seguinte sai pela metade do preço.
safeguardsAnchor:
  fr: garanties
  en: safeguards
  pt: garanties
safeguardsTitle:
  fr: Rapide, mais jamais à la légère
  en: Fast, and careful
  pt: Rápido, mas nunca de qualquer jeito
safeguardsLede:
  fr: Votre outil fait tourner votre entreprise. On le traite comme tel.
  en: Your tool runs your business. We treat it that way.
  pt: Sua ferramenta faz a sua empresa funcionar. E nós a tratamos como tal.
safeguardsList:
  - icon: tested
    title:
      fr: Testé avant d'être livré
      en: Tested before delivery
      pt: Testado antes da entrega
    text:
      fr: Chaque fonctionnalité passe par des tests automatiques, puis par une vérification à la main. Elle n'arrive chez vous qu'une fois validée.
      en: Every feature goes through automated tests, then a manual check. It only reaches you once it's been validated.
      pt: Cada funcionalidade passa por testes automáticos e depois por uma verificação manual. Ela só chega até você depois de aprovada.
  - icon: secure
    title:
      fr: Sécurisé
      en: Secure
      pt: Seguro
    text:
      fr: Connexion protégée, droits d'accès selon le rôle de chacun, données chiffrées pendant leurs échanges et sauvegardées chaque jour. Les mises à jour de sécurité sont faites au fil de l'eau, et votre outil passe un test de sécurité complet chaque mois.
      en: Protected sign-in, role-based access, data encrypted in transit and backed up daily. Security updates are applied as they come out, and your tool goes through a full security test every month.
      pt: Login protegido, permissões de acesso conforme a função de cada um, dados criptografados em trânsito e com backup diário. As atualizações de segurança são feitas continuamente, e a sua ferramenta passa por um teste de segurança completo todo mês.
  - icon: scalable
    title:
      fr: Prêt à grandir
      en: Ready to grow
      pt: Pronto para crescer
    text:
      fr: De 5 à plusieurs milliers d'utilisateurs, votre outil est construit sur une base qui suit votre croissance, sans tout reconstruire le jour où vous changez d'échelle.
      en: From 5 to several thousand users, your tool is built on a foundation that keeps up with your growth, with no rebuild the day you change scale.
      pt: De 5 a milhares de usuários, a sua ferramenta é construída sobre uma base que acompanha o seu crescimento, sem precisar refazer tudo no dia em que você mudar de escala.
  - icon: confidential
    title:
      fr: Confidentiel
      en: Confidential
      pt: Confidencial
    text:
      fr: Vos données et vos méthodes de travail restent les vôtres. On signe un accord de confidentialité dès l'audit si vous le souhaitez.
      en: Your data and the way you work stay yours. We'll sign a non-disclosure agreement at the audit if you'd like.
      pt: Seus dados e seus métodos de trabalho continuam sendo seus. Assinamos um acordo de confidencialidade já no diagnóstico, se você quiser.
faqTitle:
  fr: Vos questions, nos réponses.
  en: Your questions, answered.
  pt: Suas perguntas, nossas respostas.
faqWho:
  fr: Je suis…
  en: I am a…
  pt: Eu sou…
roles:
  - id: ceo
    label:
      fr: Dirigeant
      en: Business owner
      pt: Gestor(a)
  - id: ai
    label:
      fr: Responsable IA
      en: AI lead
      pt: Responsável por IA
  - id: it
    label:
      fr: Responsable informatique
      en: IT lead
      pt: Responsável de TI
  - id: pm
    label:
      fr: Chef de projet
      en: Project manager
      pt: Gerente de projeto
faq:
  - roles: ceo
    q:
      fr: Comment est-ce possible à ce prix ?
      en: How is this possible at this price?
      pt: Como é possível por esse preço?
    a:
      fr: "L'intelligence artificielle écrit aujourd'hui une grande partie du code. Notre temps va donc à ce qui compte : comprendre votre métier, vous répondre et vérifier chaque livraison."
      en: "Artificial intelligence now writes a large part of the code. So our time goes to what matters: understanding your business, answering you and checking every delivery."
      pt: "Hoje, a inteligência artificial escreve grande parte do código. Assim, o nosso tempo vai para o que importa: entender o seu negócio, responder a você e verificar cada entrega."
  - roles: ceo pm
    q:
      fr: Je peux vraiment tout demander, même les gros projets ?
      en: Can I really ask for anything, even big projects?
      pt: Posso mesmo pedir qualquer coisa, até projetos grandes?
    a:
      fr: Vous serez étonnés de tout ce que l'on peut faire avec notre formule. Cependant, si votre projet est particulièrement ambitieux et que notre cadence de développement s'avère insuffisante, nous pouvons créer une offre sur mesure, pour un outil sur mesure (toujours).
      en: You'll be surprised by how much we can do with our plan. That said, if your project is especially ambitious and our development pace turns out not to be enough, we can put together a custom offer, for a custom tool (as always).
      pt: Você vai se surpreender com tudo o que dá para fazer com o nosso plano. Mas, se o seu projeto for especialmente ambicioso e o nosso ritmo de desenvolvimento não for suficiente, podemos criar uma oferta sob medida, para uma ferramenta sob medida (sempre).
  - roles: ceo pm
    q:
      fr: Quel type d'outil pouvez-vous construire ?
      en: What kind of tools can you build?
      pt: Que tipo de ferramenta vocês conseguem construir?
    a:
      fr: Des outils internes (suivi clients, devis, planning d'interventions, gestion de stock, tableaux de bord) comme des outils pour vos clients (espace client, prise de rendez-vous, commandes en ligne).
      en: Internal tools (client tracking, quotes, job scheduling, stock management, dashboards) as well as tools for your customers (customer portal, appointment booking, online ordering).
      pt: Ferramentas internas (acompanhamento de clientes, orçamentos, agenda de atendimentos, controle de estoque, dashboards) e também ferramentas para os seus clientes (área do cliente, agendamento, pedidos online).
  - roles: ceo
    q:
      fr: Mon entreprise est-elle assez grande ?
      en: Is my business big enough?
      pt: Minha empresa é grande o suficiente?
    a:
      fr: "Oui, dès quelques personnes. Si une tâche vous fait perdre des heures chaque semaine, un outil fait pour vous se rentabilise vite. L'audit gratuit sert justement à le vérifier : on vous dit franchement si ça vaut le coup, même si la réponse est non."
      en: "Yes, from just a few people. If a task costs you hours every week, a tool built for you pays for itself quickly. That's what the free audit is for: we tell you honestly whether it's worth it, even if the answer is no."
      pt: "Sim, a partir de poucas pessoas. Se uma tarefa faz você perder horas toda semana, uma ferramenta feita para você se paga rápido. O diagnóstico gratuito serve justamente para verificar isso: dizemos com franqueza se vale a pena, mesmo que a resposta seja não."
  - roles: ceo it
    q:
      fr: Devons-nous résilier nos autres logiciels ?
      en: Do we have to cancel our other software?
      pt: Precisamos cancelar os nossos outros softwares?
    a:
      fr: Non. Votre outil peut remplacer un tableur ou un logiciel qui ne vous convient plus, mais il peut aussi compléter ce que vous utilisez déjà et s'y connecter quand c'est possible. On fait le tri ensemble pendant l'audit.
      en: No. Your tool can replace a spreadsheet or software that no longer suits you, but it can also complement what you already use and connect to it where possible. We sort it out together during the audit.
      pt: Não. A sua ferramenta pode substituir uma planilha ou um software que já não atende você, mas também pode complementar o que você já usa e se conectar a ele quando possível. Fazemos essa triagem juntos durante o diagnóstico.
  - roles: ceo pm
    q:
      fr: De quoi avez-vous besoin de notre côté ?
      en: What do you need from our side?
      pt: Do que vocês precisam da nossa parte?
    a:
      fr: D'une personne disponible environ une heure par semaine pour tester et valider ce qu'on livre.
      en: Someone available about an hour a week to test and approve what we deliver.
      pt: De uma pessoa disponível cerca de uma hora por semana para testar e aprovar o que entregamos.
  - roles: ceo ai
    q:
      fr: En quoi est-ce différent de Claude, Copilot ou ChatGPT ?
      en: How is this different from Claude, Copilot or ChatGPT?
      pt: Qual é a diferença em relação ao Claude, ao Copilot ou ao ChatGPT?
    a:
      fr: "Ces assistants vous aident à produire du texte ou du code, mais ne livrent pas un outil fini, testé, hébergé et maintenu. Nous les utilisons pour aller vite, et nous restons responsables du résultat : une personne qui comprend votre métier, vous répond et s'engage sur les dates."
      en: "Those assistants help you produce text or code, but they don't deliver a finished tool that's tested, hosted and maintained. We use them to move fast, and we stay accountable for the result: one person who understands your business, answers you and commits to dates."
      pt: "Esses assistentes ajudam você a produzir texto ou código, mas não entregam uma ferramenta pronta, testada, hospedada e mantida. Nós os usamos para ganhar velocidade e continuamos responsáveis pelo resultado: uma pessoa que entende o seu negócio, responde a você e se compromete com as datas."
  - roles: ai it pm
    q:
      fr: Comment empêchez-vous l'IA de faire des erreurs ?
      en: How do you stop the AI making mistakes?
      pt: Como vocês evitam que a IA cometa erros?
    a:
      fr: L'IA écrit le code, mais rien n'arrive chez vous sans vérification. Chaque fonctionnalité passe par des tests automatiques, puis par une vérification à la main, et n'est mise en ligne qu'une fois validée.
      en: AI writes the code, but nothing reaches you unchecked. Every feature goes through automated tests, then a manual review, and only goes live once approved.
      pt: A IA escreve o código, mas nada chega até você sem verificação. Cada funcionalidade passa por testes automáticos e depois por uma verificação manual, e só entra no ar depois de aprovada.
  - roles: pm
    q:
      fr: Comment demander des modifications ?
      en: How do we ask for changes?
      pt: Como pedir alterações?
    a:
      fr: "Comme ça vous arrange : un message WhatsApp, un email, ou directement depuis votre tableau de bord, où vous suivez ce qui est livré, en cours et prévu. Bugs et retouches sont traités sous 2&nbsp;heures ouvrées ; les nouvelles fonctionnalités ont une date annoncée à l'avance."
      en: "However suits you: a WhatsApp message, an email, or straight from your dashboard, where you follow what's delivered, in progress and planned. Bugs and tweaks are handled within 2&nbsp;business hours; new features get a date announced in advance."
      pt: "Como for melhor para você: uma mensagem no WhatsApp, um e-mail ou direto pelo seu painel, onde você acompanha o que foi entregue, o que está em andamento e o que está previsto. Bugs e ajustes são resolvidos em até 2&nbsp;horas úteis; as novas funcionalidades têm uma data anunciada com antecedência."
  - roles: it pm
    q:
      fr: Que se passe-t-il en cas de panne ?
      en: What happens if something breaks?
      pt: E se algo parar de funcionar?
    a:
      fr: "Vous nous le signalez, et c'est corrigé sous 2&nbsp;heures ouvrées. Et c'est la personne qui a construit votre outil qui s'en occupe : pas de ticket qui passe de main en main."
      en: "You tell us, and it's fixed within 2&nbsp;business hours. And the person who built your tool handles it: no ticket passed from hand to hand."
      pt: "Você nos avisa e corrigimos em até 2&nbsp;horas úteis. E quem cuida disso é a pessoa que construiu a sua ferramenta: nada de chamado passando de mão em mão."
  - roles: ceo it
    q:
      fr: Que se passe-t-il si j'arrête l'abonnement ?
      en: What happens if I cancel the subscription?
      pt: E se eu cancelar a assinatura?
    a:
      fr: "Vous avez le choix. Vous pouvez basculer sur une offre de maintenance seule, à <span data-price=\"maintenance\"></span>&nbsp;HT par mois hors hébergement : votre outil reste maintenu, sans nouvelle demande. Ou vous partez, et vous gardez vos données et votre outil : on vous transfère le code et la base de données, ou on vous aide à les installer chez vous."
      en: "It's up to you. You can switch to a maintenance-only plan, at <span data-price=\"maintenance\"></span> excl. VAT per month, hosting not included: your tool stays maintained, with no new requests. Or you leave, and you keep your data and your tool: we hand over the code and the database, or help you install them on your side."
      pt: "Você escolhe. Pode migrar para um plano só de manutenção, por <span data-price=\"maintenance\"></span> por mês sem impostos, hospedagem não incluída: a sua ferramenta continua mantida, sem novos pedidos. Ou você sai e fica com os seus dados e a sua ferramenta: transferimos o código e o banco de dados para você, ou ajudamos a instalá-los na sua própria infraestrutura."
