        pt: Incluída até <span data-price="hosting"></span> de custos por mês, sem impostos
      - fr: Inclus jusqu'à <span data-price="hosting"></span>&nbsp;HT de coûts par mois
        en: Included up to <span data-price="hosting"></span> of costs per month
        pt: Incluída até <span data-price="hosting"></span> de custos por mês, sem impostos
