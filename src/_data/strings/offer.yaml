quoteNotesNotePaiement:
  fr: Prix hors taxes. La première version se règle moitié à la commande, moitié à la mise en service. L'abonnement est prélevé en début de mois.
  en: Prices exclude VAT. The first version is paid half on order, half on go-live. The subscription is charged by direct debit at the start of each month.
  pt: Preços sem impostos. A primeira versão é paga metade na contratação e metade na entrada em produção. A assinatura é cobrada no início de cada mês.
quoteNotesNoteToggle2:
  fr: Hébergement
  en: Hosting
  pt: Hospedagem
