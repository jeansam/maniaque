  en: 'Your tool evolves with you. New features, fixes, details: everything goes through your request list, with no quote each time.'
  pt: 'Sua ferramenta evolui com você. Novas funções, correções, detalhes: tudo passa pela sua lista de pedidos, sem orçamento a cada vez.'
