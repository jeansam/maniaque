        en: No commitment, cancel any month, or switch to a maintenance-only plan at <span data-price="maintenance"></span> excl. VAT per month, hosting not included
        pt: Sem fidelidade, cancelável a qualquer mês, ou migração para um plano só de manutenção por <span data-price="maintenance"></span> por mês sem impostos, hospedagem não incluída
      - fr: Sans engagement, résiliable chaque mois, ou basculement sur une offre de maintenance seule à <span data-price="maintenance"></span>&nbsp;HT par mois, hors hébergement
        en: No commitment, cancel any month, or switch to a maintenance-only plan at <span data-price="maintenance"></span> excl. VAT per month, hosting not included
        pt: Sem fidelidade, cancelável a qualquer mês, ou migração para um plano só de manutenção por <span data-price="maintenance"></span> por mês sem impostos, hospedagem não incluída
notes:
  - id: paiement
    title:
      fr: Conditions de paiement
      en: Payment terms
      pt: Condições de pagamento
    text:
      fr: Prix hors taxes. La première version se règle moitié à la commande, moitié à la mise en service. L'abonnement est prélevé en début de mois.
      en: Prices exclude VAT. The first version is paid half on order, half on go-live. The subscription is charged by direct debit at the start of each month.
      pt: Preços sem impostos. A primeira versão é paga metade na contratação e metade na entrada em produção. A assinatura é cobrada no início de cada mês.
  - id: hebergement
    title:
      fr: Hébergement
      en: Hosting
      pt: Hospedagem
    text:
      fr: votre outil est hébergé par nos soins ou par vos soins, selon votre préférence. Si nous l'hébergeons, nous pouvons vous donner la propriété du code à tout moment.
      en: your tool is hosted by us or by you, whichever you prefer. If we host it, we can hand over ownership of the code at any time.
      pt: sua ferramenta é hospedada por nós ou por você, como preferir. Se nós hospedarmos, podemos transferir a propriedade do código para você a qualquer momento.
  - id: usage
    title:
      fr: Services payants à l'usage
      en: Pay-per-use services
      pt: Serviços pagos por uso
    text:
      fr: "(SMS, emails en grand volume, intelligence artificielle pour des fonctionnalités de votre outil, comptes développeur Apple et Android pour une app native...) : refacturés au coût réel, sans marge."
      en: "(text messages, high-volume emails, artificial intelligence for features of your tool, Apple and Android developer accounts for a native app...): passed on at cost, with no markup."
      pt: "(SMS, e-mails em grande volume, inteligência artificial para funcionalidades da sua ferramenta, contas de desenvolvedor Apple e Android para um app nativo...): repassados pelo custo real, sem margem."
    sep: " "
commitmentsAnchor:
  fr: engagements
  en: commitments
  pt: engagements
commitmentsTitle:
  fr: L'IA écrit le code. Nous, on tient parole.
  en: AI writes the code. We keep our word.
  pt: A IA escreve o código. Nós cumprimos a palavra.
commitmentsText:
  fr: Il y a de l'IA dans man<span class="ia">ia</span>que. Elle écrit le code, vite. Ce qui reste rare, c'est quelqu'un qui répond, qui prévient et qui livre à la date dite. C'est ça que vous payez.
  en: There's AI in man<span class="ia">ia</span>que (in French, AI is “IA”). It writes the code, fast. What's still rare is someone who answers, keeps you posted and delivers on the date they gave you. That's what you're paying for.
  pt: Tem IA em man<span class="ia">ia</span>que. Ela escreve o código, rápido. O que continua raro é alguém que responde, que avisa e que entrega na data combinada. É isso que você paga.
promises:
  - fr: <strong>Un seul interlocuteur.</strong> La personne qui vous répond est celle qui construit votre outil. <a class="inline-link" href="/articles/developpeur-ninja-ia/">Pourquoi c'est plus efficace</a>
    en: <strong>One point of contact.</strong> The person who answers you is the person building your tool. <a class="inline-link" href="/en/articles/one-person-developer-ai/">Why it works better</a>
    pt: <strong>Um único interlocutor.</strong> A pessoa que responde a você é a mesma que constrói a sua ferramenta. <a class="inline-link" href="/pt/artigos/desenvolvedor-unico-ia/">Por que isso é mais eficiente</a>
  - fr: <strong>Réponse sous 24&nbsp;h ouvrées.</strong> À chaque message, même si c'est pour vous donner une date le lendemain.
    en: <strong>A reply within 24 business hours.</strong> To every message, even if it's just to give you a date the next day.
    pt: <strong>Resposta em até 24&nbsp;h úteis.</strong> Em cada mensagem, mesmo que seja para lhe dar uma data no dia seguinte.
  - fr: "<strong>Bugs et retouches sous 2&nbsp;heures.</strong> Quelque chose ne marche pas, ou un détail est à changer : c'est fait dans les 2&nbsp;heures ouvrées."
    en: "<strong>Bugs and tweaks within 2 hours.</strong> Something's broken or a detail needs changing: it's done within 2 business hours."
    pt: "<strong>Bugs e ajustes em até 2&nbsp;horas.</strong> Algo não funciona, ou um detalhe precisa mudar: fica pronto em até 2&nbsp;horas úteis."
  - fr: <strong>Nouvelles fonctionnalités selon leur taille.</strong> Chacune est testée à fond avant d'être mise en ligne. Vous connaissez la date à l'avance, et les gros projets sont découpés en étapes.
    en: <strong>New features based on their size.</strong> Each one is fully tested before going live. You know the date in advance, and big projects are split into steps.
    pt: <strong>Novas funcionalidades conforme o tamanho.</strong> Cada uma é testada a fundo antes de entrar no ar. Você sabe a data com antecedência, e os projetos grandes são divididos em etapas.
  - fr: <strong>Un point par mois.</strong> Un compte rendu écrit, reçu dans les trois jours avant 30 minutes ensemble pour fixer les priorités.
    en: <strong>A monthly check-in.</strong> A written report, sent within the three days before a 30-minute call to set priorities.
    pt: <strong>Uma reunião por mês.</strong> Um relatório escrito, recebido três dias antes de 30 minutos juntos para definir as prioridades.
guarantee:
  title:
    fr: Notre garantie
    en: Our guarantee
    pt: Nossa garantia
  text:
    fr: Si on rate une date qu'on vous a donnée, le mois suivant est à moitié prix.
    en: If we miss a date we gave you, the next month is half price.
    pt: Se perdermos uma data que demos a você, o mês seguinte sai pela metade do preço.
safeguardsAnchor:
  fr: garanties
  en: safeguards
  pt: garanties
safeguardsTitle:
  fr: Rapide, mais jamais à la légère
  en: Fast, and careful
  pt: Rápido, mas nunca de qualquer jeito
safeguardsLede:
  fr: Votre outil fait tourner votre entreprise. On le traite comme tel.
  en: Your tool runs your business. We treat it that way.
  pt: Sua ferramenta faz a sua empresa funcionar. E nós a tratamos como tal.
safeguardsList:
  - icon: tested
    title:
      fr: Testé avant d'être livré
      en: Tested before delivery
      pt: Testado antes da entrega
    text:
      fr: Chaque fonctionnalité passe par des tests automatiques, puis par une vérification à la main. Elle n'arrive chez vous qu'une fois validée.
      en: Every feature goes through automated tests, then a manual check. It only reaches you once it's been validated.
      pt: Cada funcionalidade passa por testes automáticos e depois por uma verificação manual. Ela só chega até você depois de aprovada.
  - icon: secure
    title:
      fr: Sécurisé
      en: Secure
      pt: Seguro
    text:
      fr: Connexion protégée, droits d'accès selon le rôle de chacun, données chiffrées pendant leurs échanges et sauvegardées chaque jour. Les mises à jour de sécurité sont faites au fil de l'eau, et votre outil passe un test de sécurité complet chaque mois.
      en: Protected sign-in, role-based access, data encrypted in transit and backed up daily. Security updates are applied as they come out, and your tool goes through a full security test every month.
      pt: Login protegido, permissões de acesso conforme a função de cada um, dados criptografados em trânsito e com backup diário. As atualizações de segurança são feitas continuamente, e a sua ferramenta passa por um teste de segurança completo todo mês.
  - icon: scalable
    title:
      fr: Prêt à grandir
      en: Ready to grow
      pt: Pronto para crescer
    text:
      fr: De 5 à plusieurs milliers d'utilisateurs, votre outil est construit sur une base qui suit votre croissance, sans tout reconstruire le jour où vous changez d'échelle.
      en: From 5 to several thousand users, your tool is built on a foundation that keeps up with your growth, with no rebuild the day you change scale.
      pt: De 5 a milhares de usuários, a sua ferramenta é construída sobre uma base que acompanha o seu crescimento, sem precisar refazer tudo no dia em que você mudar de escala.
  - icon: confidential
    title:
      fr: Confidentiel
      en: Confidential
      pt: Confidencial
    text:
      fr: Vos données et vos méthodes de travail restent les vôtres. On signe un accord de confidentialité dès l'audit si vous le souhaitez.
      en: Your data and the way you work stay yours. We'll sign a non-disclosure agreement at the audit if you'd like.
      pt: Seus dados e seus métodos de trabalho continuam sendo seus. Assinamos um acordo de confidencialidade já no diagnóstico, se você quiser.
faqTitle:
  fr: Vos questions, nos réponses.
  en: Your questions, answered.
  pt: Suas perguntas, nossas respostas.
