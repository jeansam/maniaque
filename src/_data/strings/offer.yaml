detailsSummary:
  fr: Comment est-ce possible à ce prix ?
  en: How is this possible at this price?
  pt: Como é possível por esse preço?
detailsP:
  fr: 'L''intelligence artificielle écrit aujourd''hui une grande partie du code. Notre temps va donc à ce qui compte : comprendre votre métier, vous répondre et vérifier chaque livraison.'
  en: 'Artificial intelligence now writes a large part of the code. So our time goes to what matters: understanding your business, answering you and checking every delivery.'
  pt: 'Hoje, a inteligência artificial escreve grande parte do código. Assim, o nosso tempo vai para o que importa: entender o seu negócio, responder a você e verificar cada entrega.'
detailsSummary2:
  fr: Je peux vraiment tout demander, même les gros projets ?
  en: Can I really ask for anything, even big projects?
  pt: Posso mesmo pedir qualquer coisa, até projetos grandes?
detailsP2:
  fr: Vous serez étonnés de tout ce que l'on peut faire avec notre formule. Cependant, si votre projet est particulièrement ambitieux et que notre cadence de développement s'avère insuffisante, nous pouvons créer une offre sur mesure, pour un outil sur mesure (toujours).
  en: You'll be surprised by how much we can do with our plan. That said, if your project is especially ambitious and our development pace turns out not to be enough, we can put together a custom offer, for a custom tool (as always).
  pt: Você vai se surpreender com tudo o que dá para fazer com o nosso plano. Mas, se o seu projeto for especialmente ambicioso e o nosso ritmo de desenvolvimento não for suficiente, podemos criar uma oferta sob medida, para uma ferramenta sob medida (sempre).
detailsSummary3:
  fr: Quel type d'outil pouvez-vous construire ?
  en: What kind of tools can you build?
  pt: Que tipo de ferramenta vocês conseguem construir?
detailsP3:
  fr: Des outils internes (suivi clients, devis, planning d'interventions, gestion de stock, tableaux de bord) comme des outils pour vos clients (espace client, prise de rendez-vous, commandes en ligne).
  en: Internal tools (client tracking, quotes, job scheduling, stock management, dashboards) as well as tools for your customers (customer portal, appointment booking, online ordering).
  pt: Ferramentas internas (acompanhamento de clientes, orçamentos, agenda de atendimentos, controle de estoque, dashboards) e também ferramentas para os seus clientes (área do cliente, agendamento, pedidos online).
detailsSummary4:
  fr: Mon entreprise est-elle assez grande ?
  en: Is my business big enough?
  pt: Minha empresa é grande o suficiente?
detailsP4:
  fr: 'Oui, dès quelques personnes. Si une tâche vous fait perdre des heures chaque semaine, un outil fait pour vous se rentabilise vite. L''audit gratuit sert justement à le vérifier : on vous dit franchement si ça vaut le coup, même si la réponse est non.'
  en: 'Yes, from just a few people. If a task costs you hours every week, a tool built for you pays for itself quickly. That''s what the free audit is for: we tell you honestly whether it''s worth it, even if the answer is no.'
  pt: 'Sim, a partir de poucas pessoas. Se uma tarefa faz você perder horas toda semana, uma ferramenta feita para você se paga rápido. O diagnóstico gratuito serve justamente para verificar isso: dizemos com franqueza se vale a pena, mesmo que a resposta seja não.'
detailsSummary5:
  fr: Devons-nous résilier nos autres logiciels ?
  en: Do we have to cancel our other software?
  pt: Precisamos cancelar os nossos outros softwares?
detailsP5:
  fr: Non. Votre outil peut remplacer un tableur ou un logiciel qui ne vous convient plus, mais il peut aussi compléter ce que vous utilisez déjà et s'y connecter quand c'est possible. On fait le tri ensemble pendant l'audit.
  en: No. Your tool can replace a spreadsheet or software that no longer suits you, but it can also complement what you already use and connect to it where possible. We sort it out together during the audit.
  pt: Não. A sua ferramenta pode substituir uma planilha ou um software que já não atende você, mas também pode complementar o que você já usa e se conectar a ele quando possível. Fazemos essa triagem juntos durante o diagnóstico.
detailsSummary6:
  fr: De quoi avez-vous besoin de notre côté ?
  en: What do you need from our side?
  pt: Do que vocês precisam da nossa parte?
detailsP6:
  fr: D'une personne disponible environ une heure par semaine pour tester et valider ce qu'on livre.
  en: Someone available about an hour a week to test and approve what we deliver.
  pt: De uma pessoa disponível cerca de uma hora por semana para testar e aprovar o que entregamos.
detailsSummary7:
  fr: En quoi est-ce différent de Claude, Copilot ou ChatGPT ?
  en: How is this different from Claude, Copilot or ChatGPT?
  pt: Qual é a diferença em relação ao Claude, ao Copilot ou ao ChatGPT?
detailsP7:
  fr: 'Ces assistants vous aident à produire du texte ou du code, mais ne livrent pas un outil fini, testé, hébergé et maintenu. Nous les utilisons pour aller vite, et nous restons responsables du résultat : une personne qui comprend votre métier, vous répond et s''engage sur les dates.'
  en: 'Those assistants help you produce text or code, but they don''t deliver a finished tool that''s tested, hosted and maintained. We use them to move fast, and we stay accountable for the result: one person who understands your business, answers you and commits to dates.'
  pt: 'Esses assistentes ajudam você a produzir texto ou código, mas não entregam uma ferramenta pronta, testada, hospedada e mantida. Nós os usamos para ganhar velocidade e continuamos responsáveis pelo resultado: uma pessoa que entende o seu negócio, responde a você e se compromete com as datas.'
detailsSummary8:
  fr: Comment empêchez-vous l'IA de faire des erreurs ?
  en: How do you stop the AI making mistakes?
  pt: Como vocês evitam que a IA cometa erros?
detailsP8:
  fr: L'IA écrit le code, mais rien n'arrive chez vous sans vérification. Chaque fonctionnalité passe par des tests automatiques, puis par une vérification à la main, et n'est mise en ligne qu'une fois validée.
  en: AI writes the code, but nothing reaches you unchecked. Every feature goes through automated tests, then a manual review, and only goes live once approved.
  pt: A IA escreve o código, mas nada chega até você sem verificação. Cada funcionalidade passa por testes automáticos e depois por uma verificação manual, e só entra no ar depois de aprovada.
detailsSummary9:
  fr: Comment demander des modifications ?
  en: How do we ask for changes?
  pt: Como pedir alterações?
detailsP9:
  fr: 'Comme ça vous arrange : un message WhatsApp, un email, ou directement depuis votre tableau de bord, où vous suivez ce qui est livré, en cours et prévu. Bugs et retouches sont traités sous 2&nbsp;heures ouvrées ; les nouvelles fonctionnalités ont une date annoncée à l''avance.'
  en: 'However suits you: a WhatsApp message, an email, or straight from your dashboard, where you follow what''s delivered, in progress and planned. Bugs and tweaks are handled within 2&nbsp;business hours; new features get a date announced in advance.'
  pt: 'Como for melhor para você: uma mensagem no WhatsApp, um e-mail ou direto pelo seu painel, onde você acompanha o que foi entregue, o que está em andamento e o que está previsto. Bugs e ajustes são resolvidos em até 2&nbsp;horas úteis; as novas funcionalidades têm uma data anunciada com antecedência.'
detailsSummary10:
  fr: Que se passe-t-il en cas de panne ?
  en: What happens if something breaks?
  pt: E se algo parar de funcionar?
detailsP10:
  fr: 'Vous nous le signalez, et c''est corrigé sous 2&nbsp;heures ouvrées. Et c''est la personne qui a construit votre outil qui s''en occupe : pas de ticket qui passe de main en main.'
  en: 'You tell us, and it''s fixed within 2&nbsp;business hours. And the person who built your tool handles it: no ticket passed from hand to hand.'
  pt: 'Você nos avisa e corrigimos em até 2&nbsp;horas úteis. E quem cuida disso é a pessoa que construiu a sua ferramenta: nada de chamado passando de mão em mão.'
detailsSummary11:
  fr: Que se passe-t-il si j'arrête l'abonnement ?
  en: What happens if I cancel the subscription?
  pt: E se eu cancelar a assinatura?
detailsP11:
  fr: 'Vous avez le choix. Vous pouvez basculer sur une offre de maintenance seule, à <span data-price="maintenance"></span>&nbsp;HT par mois hors hébergement : votre outil reste maintenu, sans nouvelle demande. Ou vous partez, et vous gardez vos données et votre outil : on vous transfère le code et la base de données, ou on vous aide à les installer chez vous.'
  en: 'It''s up to you. You can switch to a maintenance-only plan, at <span data-price="maintenance"></span> excl. VAT per month, hosting not included: your tool stays maintained, with no new requests. Or you leave, and you keep your data and your tool: we hand over the code and the database, or help you install them on your side.'
  pt: 'Você escolhe. Pode migrar para um plano só de manutenção, por <span data-price="maintenance"></span> por mês sem impostos, hospedagem não incluída: a sua ferramenta continua mantida, sem novos pedidos. Ou você sai e fica com os seus dados e a sua ferramenta: transferimos o código e o banco de dados para você, ou ajudamos a instalá-los na sua própria infraestrutura.'
detailsSummary12:
  fr: Où sont stockées mes données ?
  en: Where is my data stored?
  pt: Onde ficam armazenados os meus dados?
detailsP12:
  fr: On en discute ensemble pendant la phase de cadrage. Il existe des solutions d'hébergement en Europe comme en France, et on s'adapte à vos besoins.
  en: We discuss it together during the scoping phase. There are hosting options in Europe and in France, and we adapt to your needs.
  pt: Conversamos sobre isso juntos na fase de escopo. Existem opções de hospedagem na Europa e na França, e nos adaptamos às suas necessidades.
detailsP13:
  fr: On en discute ensemble pendant la phase de cadrage. Vos données peuvent être hébergées au Brésil, et on s'adapte à vos besoins.
  en: We discuss it together during the scoping phase. Your data can be hosted in Brazil, and we adapt to your needs.
  pt: Conversamos sobre isso juntos na fase de escopo. Os seus dados podem ficar hospedados no Brasil, e nos adaptamos às suas necessidades.
detailsP14:
  fr: On en discute ensemble pendant la phase de cadrage. Il existe des solutions d'hébergement en Afrique, et on s'adapte à vos besoins.
  en: We discuss it together during the scoping phase. There are hosting options in Africa, and we adapt to your needs.
  pt: Conversamos sobre isso juntos na fase de escopo. Existem opções de hospedagem na África, e nos adaptamos às suas necessidades.
detailsSummary13:
  fr: Avec quelles technologies travaillez-vous ?
  en: Which technologies do you use?
  pt: Com quais tecnologias vocês trabalham?
detailsP15:
  fr: On fait une veille régulière sur les outils de développement à l'ère de l'IA, pour vous proposer à l'audit la combinaison la plus performante et la plus fiable du moment. Selon votre besoin, c'est du code sur mesure, ou <a class="inline-link" href="https://bubble.io/" target="_blank" rel="noopener">Bubble</a> si vous voulez pouvoir modifier l'outil vous-même.
  en: We keep a regular watch on development tools in the age of AI, so at the audit we can offer you the best-performing, most reliable combination available. Depending on your needs, that's custom code, or <a class="inline-link" href="https://bubble.io/" target="_blank" rel="noopener">Bubble</a> if you want to be able to edit the tool yourself.
  pt: Acompanhamos de perto as ferramentas de desenvolvimento na era da IA, para propor no diagnóstico a combinação mais eficiente e confiável do momento. Conforme a sua necessidade, pode ser código sob medida ou <a class="inline-link" href="https://bubble.io/" target="_blank" rel="noopener">Bubble</a>, se você quiser poder modificar a ferramenta por conta própria.
audit:
  fr: Parlons de ce qui vous agace au quotidien.
  en: Let's talk about what bugs you every day.
  pt: Vamos falar do que irrita você no dia a dia.
auditP:
  fr: 45 minutes, gratuites et sans engagement. Vous repartez avec un avis franc, même si c'est pour nous dire non.
  en: 45 minutes, free and with no commitment. You leave with an honest opinion, even if it's to tell you no.
  pt: 45 minutos, gratuitos e sem compromisso. Você sai com uma opinião franca, mesmo que seja para nos dizer não.
auditLink:
  fr: Choisir un créneau
  en: Pick a time slot
  pt: Escolher um horário
auditCtaAlt:
  fr: Ou écrivez-nous à <a href="mailto:hello@maniaque.xyz">hello@maniaque.xyz</a>
  en: Or email us at <a href="mailto:hello@maniaque.xyz">hello@maniaque.xyz</a>
  pt: Ou escreva para <a href="mailto:hello@maniaque.xyz">hello@maniaque.xyz</a>
