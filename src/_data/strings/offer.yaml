stepsTitle:
  fr: Comment ça marche
  en: How it works
  pt: Como funciona
steps:
  - title:
      fr: Audit gratuit
      en: Free audit
      pt: Diagnóstico gratuito
    meta:
      fr: 45 minutes
      en: 45 minutes
      pt: 45 minutos
    text:
      fr: "On parle de votre activité et de ce qui vous fait perdre du temps. Vous recevez ensuite une page claire : le problème, ce que ferait la première version, le coût mensuel total, et notre avis franc sur l'intérêt d'y aller."
      en: "We talk about your business and what's wasting your time. You then get one clear page: the problem, what the first version would do, the total monthly cost, and our honest opinion on whether it's worth it."
      pt: "Conversamos sobre a sua atividade e sobre o que faz você perder tempo. Depois, você recebe uma página clara: o problema, o que a primeira versão faria, o custo mensal total e a nossa opinião franca sobre se vale a pena seguir em frente."
  - title:
      fr: Cadrage
      en: Scoping
      pt: Escopo
    meta:
      fr: Avant de construire
      en: Before we build
      pt: Antes de construir
    text:
      fr: "On précise ensemble le périmètre de la première version : les écrans, les données, les règles de votre métier et l'endroit où héberger l'outil. Le compte à rebours démarre une fois ce périmètre validé."
      en: "Together we pin down the scope of the first version: the screens, the data, your business rules and where the tool will be hosted. The clock starts once that scope is approved."
      pt: "Definimos juntos o escopo da primeira versão: as telas, os dados, as regras do seu negócio e onde a ferramenta vai ficar hospedada. A contagem regressiva começa assim que esse escopo é aprovado."
  - title:
      fr: Première version
      en: First version
      pt: Primeira versão
    meta:
      fr: 2 à 8 semaines
      en: 2 to 8 weeks
      pt: 2 a 8 semanas
    text:
      fr: On construit l'outil sur le périmètre validé. Vous l'utilisez pour de vrai, avec vos équipes et vos données, que ce soit une application web, ou une application native.
      en: We build the tool on the approved scope. You use it for real, with your teams and your data, whether it is a web app or a native app.
      pt: Construímos a ferramenta dentro do escopo aprovado. Você a usa de verdade, com as suas equipes e os seus dados, seja um aplicativo web ou um aplicativo nativo.
  - title:
      fr: Itérations en continu
      en: Continuous iterations
      pt: Iterações contínuas
    meta:
      fr: <span data-price="monthly"></span> HT par mois
      en: <span data-price="monthly"></span> excl. VAT per month
      pt: <span data-price="monthly"></span> por mês, sem impostos
    text:
      fr: "Votre outil évolue avec vous. Nouvelles fonctions, corrections, détails : tout passe par votre liste de demandes, sans devis à chaque fois."
      en: "Your tool evolves with you. New features, fixes, details: everything goes through your request list, with no quote each time."
      pt: "Sua ferramenta evolui com você. Novas funções, correções, detalhes: tudo passa pela sua lista de pedidos, sem orçamento a cada vez."
pricingTitle:
  fr: Deux formules. Aucun frais caché.
  en: Two plans. No hidden fees.
  pt: Dois planos. Nenhum custo oculto.
pricingLede:
  fr: Choisissez de payer la première version ou de vous engager plus longtemps. L'abonnement est le même.
  en: Pay for the first version, or commit for longer and get it free. The subscription is the same.
  pt: Escolha pagar pela primeira versão ou se comprometer por mais tempo. A assinatura é a mesma.
plansCaption:
  fr: Comparaison des deux formules
  en: Comparison of the two plans
  pt: Comparação dos dois planos
plans:
  - fr: Première version payée
    en: Paid first version
