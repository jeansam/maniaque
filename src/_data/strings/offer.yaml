title:
  fr: outils sur mesure pour PME
  en: custom software for small businesses
  pt: softwares sob medida para PMEs
description:
  fr: "Un outil sur mesure pour votre entreprise, puis tout ce que vous imaginez : du petit détail à la grosse fonctionnalité. 490\_€ HT par mois. Audit gratuit."
  en: "Custom software for your business, then everything you can think of: from the smallest detail to the biggest feature. ZAR\_9,900 excl. VAT per month. Free audit."
  pt: "Um software sob medida para a sua empresa e, depois, tudo o que você imaginar: do menor detalhe à maior funcionalidade. R$\_2.900 por mês, sem impostos. Diagnóstico gratuito."
ogTitle:
  fr: Maniaque, soyez aussi maniaque que vous voulez
  en: Maniaque, be as maniaque as you want
  pt: Maniaque, seja tão maniaque quanto quiser
ogDescription:
  fr: "Outils sur mesure pour PME. Bugs et retouches traités sous 2 heures, nouvelles fonctionnalités testées à fond. 490\_€ HT par mois."
  en: "Custom software for small businesses. Bugs and tweaks handled within 2 hours, new features fully tested. ZAR\_9,900 excl. VAT per month."
  pt: "Softwares sob medida para PMEs. Bugs e ajustes resolvidos em até 2 horas, novas funcionalidades testadas a fundo. R$\_2.900 por mês, sem impostos."
heroLine1:
  fr: Soyez aussi
  en: Be as
  pt: Seja tão
heroLine3:
  fr: que vous voulez.
  en: as you want.
  pt: quanto quiser.
meaningLabel:
  en: What maniaque means
  pt: O que significa maniaque
noteAsk:
  fr: « Plus gras. Et un peu plus à gauche. »
  en: “Bolder. And a bit more to the left.”
  pt: “Mais negrito. E um pouco mais para a esquerda.”
noteNext:
  fr: « Maintenant, un espace client complet. »
  en: “Now, a complete customer portal.”
  pt: “Agora, uma área do cliente completa.”
meaning:
  en: <em lang="fr">Maniaque</em> is French for fussy, not maniac 😅. And yes, there's AI in it.
  pt: <em lang="fr">Maniaque</em> quer dizer “maníaco por detalhes” em francês 😅. E sim, tem IA no nome.
lede:
  fr: Au lieu de toute une équipe, <strong>un spécialiste Produit et IA dédié crée un nouvel outil digital sur mesure</strong> pour votre entreprise. Sa force&nbsp;? Formaliser et donner vie à vos idées de bout en bout. Pour <strong><span data-price="monthly"></span>&nbsp;HT par mois</strong>.
  en: Instead of a whole team, <strong>one dedicated Product and AI specialist builds a new custom digital tool</strong> for your business. Their strength? Shaping your ideas and bringing them to life from start to finish. For <strong><span data-price="monthly"></span> excl. VAT per month</strong>.
  pt: Em vez de uma equipe inteira, <strong>um especialista dedicado em Produto e IA cria uma nova ferramenta digital sob medida</strong> para a sua empresa. O ponto forte dele? Dar forma às suas ideias e torná-las realidade, do início ao fim. Por <strong><span data-price="monthly"></span> por mês, sem impostos</strong>.
seePricing:
  fr: Voir les tarifs
  en: See pricing
  pt: Ver os preços
answers:
  fr: vous répond.
  en: will get back to you.
  pt: responde a você.
showcaseLabel:
  fr: "Exemples d'outils sur mesure : tableaux de bord, CRM, stocks, plannings et applications mobiles"
  en: "Examples of custom tools: dashboards, CRM, inventory, schedules and mobile apps"
  pt: "Exemplos de ferramentas sob medida: dashboards, CRM, estoque, agendas e aplicativos mobile"
stepsTitle:
  fr: Comment ça marche
  en: How it works
  pt: Como funciona
steps:
  - title:
      fr: Audit gratuit
      en: Free audit
      pt: Diagnóstico gratuito
    meta:
      fr: 45 minutes
      en: 45 minutes
      pt: 45 minutos
    text:
      fr: "On parle de votre activité et de ce qui vous fait perdre du temps. Vous recevez ensuite une page claire : le problème, ce que ferait la première version, le coût mensuel total, et notre avis franc sur l'intérêt d'y aller."
      en: "We talk about your business and what's wasting your time. You then get one clear page: the problem, what the first version would do, the total monthly cost, and our honest opinion on whether it's worth it."
      pt: "Conversamos sobre a sua atividade e sobre o que faz você perder tempo. Depois, você recebe uma página clara: o problema, o que a primeira versão faria, o custo mensal total e a nossa opinião franca sobre se vale a pena seguir em frente."
  - title:
      fr: Cadrage
      en: Scoping
      pt: Escopo
    meta:
      fr: Avant de construire
      en: Before we build
      pt: Antes de construir
    text:
      fr: "On précise ensemble le périmètre de la première version : les écrans, les données, les règles de votre métier et l'endroit où héberger l'outil. Le compte à rebours démarre une fois ce périmètre validé."
      en: "Together we pin down the scope of the first version: the screens, the data, your business rules and where the tool will be hosted. The clock starts once that scope is approved."
      pt: "Definimos juntos o escopo da primeira versão: as telas, os dados, as regras do seu negócio e onde a ferramenta vai ficar hospedada. A contagem regressiva começa assim que esse escopo é aprovado."
  - title:
      fr: Première version
      en: First version
      pt: Primeira versão
    meta:
      fr: 2 à 8 semaines
      en: 2 to 8 weeks
      pt: 2 a 8 semanas
    text:
      fr: On construit l'outil sur le périmètre validé. Vous l'utilisez pour de vrai, avec vos équipes et vos données, que ce soit une application web, ou une application native.
      en: We build the tool on the approved scope. You use it for real, with your teams and your data, whether it is a web app or a native app.
      pt: Construímos a ferramenta dentro do escopo aprovado. Você a usa de verdade, com as suas equipes e os seus dados, seja um aplicativo web ou um aplicativo nativo.
  - title:
      fr: Itérations en continu
      en: Continuous iterations
      pt: Iterações contínuas
    meta:
      fr: <span data-price="monthly"></span> HT par mois
      en: <span data-price="monthly"></span> excl. VAT per month
      pt: <span data-price="monthly"></span> por mês, sem impostos
    text:
      fr: "Votre outil évolue avec vous. Nouvelles fonctions, corrections, détails : tout passe par votre liste de demandes, sans devis à chaque fois."
      en: "Your tool evolves with you. New features, fixes, details: everything goes through your request list, with no quote each time."
      pt: "Sua ferramenta evolui com você. Novas funções, correções, detalhes: tudo passa pela sua lista de pedidos, sem orçamento a cada vez."
pricingTitle:
  fr: Deux formules. Aucun frais caché.
  en: Two plans. No hidden fees.
  pt: Dois planos. Nenhum custo oculto.
pricingLede:
  fr: Choisissez de payer la première version ou de vous engager plus longtemps. L'abonnement est le même.
  en: Pay for the first version, or commit for longer and get it free. The subscription is the same.
  pt: Escolha pagar pela primeira versão ou se comprometer por mais tempo. A assinatura é a mesma.
plansCaption:
  fr: Comparaison des deux formules
  en: Comparison of the two plans
  pt: Comparação dos dois planos
