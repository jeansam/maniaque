quoteNotesNoteHebergement:
  fr: votre outil est hébergé par nos soins ou par vos soins, selon votre préférence. Si nous l'hébergeons, nous pouvons vous donner la propriété du code à tout moment.
  en: your tool is hosted by us or by you, whichever you prefer. If we host it, we can hand over ownership of the code at any time.
  pt: sua ferramenta é hospedada por nós ou por você, como preferir. Se nós hospedarmos, podemos transferir a propriedade do código para você a qualquer momento.
quoteNotesNoteToggle3:
  fr: Services payants à l'usage
  en: Pay-per-use services
  pt: Serviços pagos por uso
quoteNotesNoteUsage:
  fr: '(SMS, emails en grand volume, intelligence artificielle pour des fonctionnalités de votre outil, comptes développeur Apple et Android pour une app native...) : refacturés au coût réel, sans marge.'
  en: '(text messages, high-volume emails, artificial intelligence for features of your tool, Apple and Android developer accounts for a native app...): passed on at cost, with no markup.'
  pt: '(SMS, e-mails em grande volume, inteligência artificial para funcionalidades da sua ferramenta, contas de desenvolvedor Apple e Android para um app nativo...): repassados pelo custo real, sem margem.'
