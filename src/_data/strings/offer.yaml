title:
  fr: outils sur mesure pour PME
  en: custom software for small businesses
  pt: softwares sob medida para PMEs
description:
  fr: "Un outil sur mesure pour votre entreprise, puis tout ce que vous imaginez : du petit détail à la grosse fonctionnalité. 490\_€ HT par mois. Audit gratuit."
  en: "Custom software for your business, then everything you can think of: from the smallest detail to the biggest feature. ZAR\_9,900 excl. VAT per month. Free audit."
  pt: "Um software sob medida para a sua empresa e, depois, tudo o que você imaginar: do menor detalhe à maior funcionalidade. R$\_2.900 por mês, sem impostos. Diagnóstico gratuito."
ogTitle:
  fr: Maniaque, soyez aussi maniaque que vous voulez
  en: Maniaque, be as maniaque as you want
  pt: Maniaque, seja tão maniaque quanto quiser
ogDescription:
  fr: "Outils sur mesure pour PME. Bugs et retouches traités sous 2 heures, nouvelles fonctionnalités testées à fond. 490\_€ HT par mois."
  en: "Custom software for small businesses. Bugs and tweaks handled within 2 hours, new features fully tested. ZAR\_9,900 excl. VAT per month."
  pt: "Softwares sob medida para PMEs. Bugs e ajustes resolvidos em até 2 horas, novas funcionalidades testadas a fundo. R$\_2.900 por mês, sem impostos."
heroWrap:
  fr: |2-

          <div class="hero-head">
            <h1 class="hero-title">
              <span class="line">Soyez aussi</span>
              <span class="line"><span class="target" id="target">man<span class="ia">ia</span>que</span></span>
              <span class="line">que vous voulez.</span>
            </h1>
            <div class="note" aria-hidden="true">
              <p class="note-ask">« Plus gras. Et un peu plus à gauche. »</p>
              <p class="note-next">« Maintenant, un espace client complet. »</p>
            </div>
          </div>
          <div class="hero-foot">
            <p class="lede">Au lieu de toute une équipe, <strong>un spécialiste Produit et IA dédié crée un nouvel outil digital sur mesure</strong> pour votre entreprise. Sa force&nbsp;? Formaliser et donner vie à vos idées de bout en bout. Pour <strong><span data-price="monthly"></span>&nbsp;HT par mois</strong>.</p>
            <div class="hero-cta">
              <div class="hero-actions">
                <a data-book class="btn" target="_blank" rel="noopener">Réserver mon audit gratuit</a>
                <a class="link" href="#tarifs">Voir les tarifs</a>
              </div>
              <a class="who" href="/a-propos/"><img data-person-photo src="/images/avatar-jean-samuel.webp" width="32" height="32" alt=""><span><span data-person-name>Jean-Sam</span> vous répond.</span></a>
            </div>
          </div>
        
  en: |2-

          <div class="hero-head">
            <h1 class="hero-title">
              <span class="line">Be as</span>
              <span class="line"><span class="target" id="target">man<span class="ia">ia</span>que</span><a class="star" href="#meaning" aria-label="What maniaque means">*</a></span>
              <span class="line">as you want.</span>
            </h1>
            <div class="note" aria-hidden="true">
              <p class="note-ask">“Bolder. And a bit more to the left.”</p>
              <p class="note-next">“Now, a complete customer portal.”</p>
            </div>
          </div>
          <p class="meaning" id="meaning"><span class="star-ref" aria-hidden="true">*</span><em lang="fr">Maniaque</em> is French for fussy, not maniac 😅. And yes, there's AI in it.</p>
          <div class="hero-foot">
            <p class="lede">Instead of a whole team, <strong>one dedicated Product and AI specialist builds a new custom digital tool</strong> for your business. Their strength? Shaping your ideas and bringing them to life from start to finish. For <strong><span data-price="monthly"></span> excl. VAT per month</strong>.</p>
            <div class="hero-cta">
              <div class="hero-actions">
                <a data-book class="btn" target="_blank" rel="noopener">Book my free audit</a>
                <a class="link" href="#pricing">See pricing</a>
              </div>
              <a class="who" href="/en/about/"><img data-person-photo src="/images/avatar-nthuseni-mathaga.webp" width="32" height="32" alt=""><span><span data-person-name>Nthuseni</span> will get back to you.</span></a>
            </div>
          </div>
        
  pt: |2-

          <div class="hero-head">
            <h1 class="hero-title">
              <span class="line">Seja tão</span>
              <span class="line"><span class="target" id="target">man<span class="ia">ia</span>que</span><a class="star" href="#meaning" aria-label="O que significa maniaque">*</a></span>
              <span class="line">quanto quiser.</span>
            </h1>
            <div class="note" aria-hidden="true">
              <p class="note-ask">“Mais negrito. E um pouco mais para a esquerda.”</p>
              <p class="note-next">“Agora, uma área do cliente completa.”</p>
            </div>
          </div>
          <p class="meaning" id="meaning"><span class="star-ref" aria-hidden="true">*</span><em lang="fr">Maniaque</em> quer dizer “maníaco por detalhes” em francês 😅. E sim, tem IA no nome.</p>
          <div class="hero-foot">
            <p class="lede">Em vez de uma equipe inteira, <strong>um especialista dedicado em Produto e IA cria uma nova ferramenta digital sob medida</strong> para a sua empresa. O ponto forte dele? Dar forma às suas ideias e torná-las realidade, do início ao fim. Por <strong><span data-price="monthly"></span> por mês, sem impostos</strong>.</p>
            <div class="hero-cta">
              <div class="hero-actions">
                <a data-book class="btn" target="_blank" rel="noopener">Agendar meu diagnóstico gratuito</a>
                <a class="link" href="#precos">Ver os preços</a>
              </div>
              <a class="who" href="/pt/sobre/"><img data-person-photo src="/images/avatar-eliakim-oliveira.webp" width="32" height="32" alt=""><span><span data-person-name>Eliakim</span> responde a você.</span></a>
            </div>
          </div>
        
