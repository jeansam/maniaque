splitTextCommitments:
  fr: L'IA écrit le code. Nous, on tient parole.
  en: AI writes the code. We keep our word.
  pt: A IA escreve o código. Nós cumprimos a palavra.
splitTextP:
  fr: Il y a de l'IA dans man<span class="ia">ia</span>que. Elle écrit le code, vite. Ce qui reste rare, c'est quelqu'un qui répond, qui prévient et qui livre à la date dite. C'est ça que vous payez.
  en: There's AI in man<span class="ia">ia</span>que (in French, AI is “IA”). It writes the code, fast. What's still rare is someone who answers, keeps you posted and delivers on the date they gave you. That's what you're paying for.
  pt: Tem IA em man<span class="ia">ia</span>que. Ela escreve o código, rápido. O que continua raro é alguém que responde, que avisa e que entrega na data combinada. É isso que você paga.
promisesLi:
  fr: <strong>Un seul interlocuteur.</strong> La personne qui vous répond est celle qui construit votre outil. <a class="inline-link" href="/articles/developpeur-ninja-ia/">Pourquoi c'est plus efficace</a>
  en: <strong>One point of contact.</strong> The person who answers you is the person building your tool. <a class="inline-link" href="/en/articles/one-person-developer-ai/">Why it works better</a>
  pt: <strong>Um único interlocutor.</strong> A pessoa que responde a você é a mesma que constrói a sua ferramenta. <a class="inline-link" href="/pt/artigos/desenvolvedor-unico-ia/">Por que isso é mais eficiente</a>
promisesLi2:
  fr: <strong>Réponse sous 24&nbsp;h ouvrées.</strong> À chaque message, même si c'est pour vous donner une date le lendemain.
  en: <strong>A reply within 24 business hours.</strong> To every message, even if it's just to give you a date the next day.
  pt: <strong>Resposta em até 24&nbsp;h úteis.</strong> Em cada mensagem, mesmo que seja para lhe dar uma data no dia seguinte.
promisesLi3:
  fr: '<strong>Bugs et retouches sous 2&nbsp;heures.</strong> Quelque chose ne marche pas, ou un détail est à changer : c''est fait dans les 2&nbsp;heures ouvrées.'
  en: '<strong>Bugs and tweaks within 2 hours.</strong> Something''s broken or a detail needs changing: it''s done within 2 business hours.'
  pt: '<strong>Bugs e ajustes em até 2&nbsp;horas.</strong> Algo não funciona, ou um detalhe precisa mudar: fica pronto em até 2&nbsp;horas úteis.'
promisesLi4:
  fr: <strong>Nouvelles fonctionnalités selon leur taille.</strong> Chacune est testée à fond avant d'être mise en ligne. Vous connaissez la date à l'avance, et les gros projets sont découpés en étapes.
  en: <strong>New features based on their size.</strong> Each one is fully tested before going live. You know the date in advance, and big projects are split into steps.
  pt: <strong>Novas funcionalidades conforme o tamanho.</strong> Cada uma é testada a fundo antes de entrar no ar. Você sabe a data com antecedência, e os projetos grandes são divididos em etapas.
promisesLi5:
  fr: <strong>Un point par mois.</strong> Un compte rendu écrit, reçu dans les trois jours avant 30 minutes ensemble pour fixer les priorités.
  en: <strong>A monthly check-in.</strong> A written report, sent within the three days before a 30-minute call to set priorities.
  pt: <strong>Uma reunião por mês.</strong> Um relatório escrito, recebido três dias antes de 30 minutos juntos para definir as prioridades.
guaranteeTitle:
  fr: Notre garantie
  en: Our guarantee
  pt: Nossa garantia
guaranteeP:
  fr: Si on rate une date qu'on vous a donnée, le mois suivant est à moitié prix.
  en: If we miss a date we gave you, the next month is half price.
  pt: Se perdermos uma data que demos a você, o mês seguinte sai pela metade do preço.
