title:
  fr: outils sur mesure pour PME
  en: custom software for small businesses
  pt: softwares sob medida para PMEs
description:
  fr: "Un outil sur mesure pour votre entreprise, puis tout ce que vous imaginez : du petit détail à la grosse fonctionnalité. 490\_€ HT par mois. Audit gratuit."
  en: "Custom software for your business, then everything you can think of: from the smallest detail to the biggest feature. ZAR\_9,900 excl. VAT per month. Free audit."
  pt: "Um software sob medida para a sua empresa e, depois, tudo o que você imaginar: do menor detalhe à maior funcionalidade. R$\_2.900 por mês, sem impostos. Diagnóstico gratuito."
ogTitle:
  fr: Maniaque, soyez aussi maniaque que vous voulez
  en: Maniaque, be as maniaque as you want
  pt: Maniaque, seja tão maniaque quanto quiser
ogDescription:
  fr: "Outils sur mesure pour PME. Bugs et retouches traités sous 2 heures, nouvelles fonctionnalités testées à fond. 490\_€ HT par mois."
  en: "Custom software for small businesses. Bugs and tweaks handled within 2 hours, new features fully tested. ZAR\_9,900 excl. VAT per month."
  pt: "Softwares sob medida para PMEs. Bugs e ajustes resolvidos em até 2 horas, novas funcionalidades testadas a fundo. R$\_2.900 por mês, sem impostos."
heroLine1:
  fr: Soyez aussi
  en: Be as
  pt: Seja tão
heroLine3:
  fr: que vous voulez.
  en: as you want.
  pt: quanto quiser.
meaningLabel:
  en: What maniaque means
  pt: O que significa maniaque
noteAsk:
  fr: « Plus gras. Et un peu plus à gauche. »
  en: “Bolder. And a bit more to the left.”
  pt: “Mais negrito. E um pouco mais para a esquerda.”
noteNext:
  fr: « Maintenant, un espace client complet. »
  en: “Now, a complete customer portal.”
  pt: “Agora, uma área do cliente completa.”
meaning:
  en: <em lang="fr">Maniaque</em> is French for fussy, not maniac 😅. And yes, there's AI in it.
  pt: <em lang="fr">Maniaque</em> quer dizer “maníaco por detalhes” em francês 😅. E sim, tem IA no nome.
lede:
  fr: Au lieu de toute une équipe, <strong>un spécialiste Produit et IA dédié crée un nouvel outil digital sur mesure</strong> pour votre entreprise. Sa force&nbsp;? Formaliser et donner vie à vos idées de bout en bout. Pour <strong><span data-price="monthly"></span>&nbsp;HT par mois</strong>.
  en: Instead of a whole team, <strong>one dedicated Product and AI specialist builds a new custom digital tool</strong> for your business. Their strength? Shaping your ideas and bringing them to life from start to finish. For <strong><span data-price="monthly"></span> excl. VAT per month</strong>.
  pt: Em vez de uma equipe inteira, <strong>um especialista dedicado em Produto e IA cria uma nova ferramenta digital sob medida</strong> para a sua empresa. O ponto forte dele? Dar forma às suas ideias e torná-las realidade, do início ao fim. Por <strong><span data-price="monthly"></span> por mês, sem impostos</strong>.
seePricing:
  fr: Voir les tarifs
  en: See pricing
  pt: Ver os preços
answers:
  fr: vous répond.
  en: will get back to you.
  pt: responde a você.
showcaseLabel:
  fr: "Exemples d'outils sur mesure : tableaux de bord, CRM, stocks, plannings et applications mobiles"
  en: "Examples of custom tools: dashboards, CRM, inventory, schedules and mobile apps"
  pt: "Exemplos de ferramentas sob medida: dashboards, CRM, estoque, agendas e aplicativos mobile"
