                    <span class="article-card-text">What an agency charged for a basic CRM, first in code, then in no-code, and now with AI. Sourced figures, and what doesn't get cheaper.</span>
                  </span>
                
      pt: |2-

                  <img src="/pt/artigos/custo-do-codigo-crm/illustration.webp" width="1600" height="840" alt="" loading="lazy">
