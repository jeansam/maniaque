  usecaseIndex: { fr: Cas d'usage, en: Use cases, pt: Casos de uso }
  about: { fr: À propos, en: About, pt: Sobre }
  articleIndex: { fr: Articles, en: Articles, pt: Artigos }
languageLabel: { fr: "Langue : ", en: "Language: ", pt: "Idioma: " }
book: { fr: Réserver un audit, en: Book an audit, pt: Agendar diagnóstico }
