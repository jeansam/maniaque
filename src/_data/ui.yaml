  pricing: { id: { fr: tarifs, en: pricing, pt: precos }, label: { fr: Tarifs, en: Pricing, pt: Preços } }
  faq: { id: faq, label: FAQ }
more: { fr: Plus, en: More, pt: Mais }
moreLinks: { fr: Plus de liens, en: More links, pt: Mais links }
