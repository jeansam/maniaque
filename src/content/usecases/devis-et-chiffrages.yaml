strings:
  title:
    fr: Devis et chiffrages
    en: Quotes and estimates
    pt: Orçamentos
  description:
    fr: 'Un logiciel de devis construit autour de vos tarifs et de vos marges : le devis se monte en quelques minutes, part à vos couleurs et se relance tout seul.'
    en: 'Quoting software built around your rates and your margins: a quote comes together in minutes, goes out in your brand and follows itself up.'
    pt: 'Um software de orçamentos construído em torno dos seus preços e das suas margens: o orçamento fica pronto em poucos minutos, sai com a sua identidade visual e é cobrado sozinho.'
  uc:
    fr: Un logiciel de devis qui connaît vos tarifs, <span>et protège vos marges.</span>
    en: Quoting software that knows your rates, <span>and protects your margins.</span>
    pt: Um software de orçamentos que conhece os seus preços, <span>e protege as suas margens.</span>
  ucLede:
    fr: 'Nous construisons des outils de devis pour les artisans, les installateurs et les entreprises de services. Vos prix, vos marges et vos options sont déjà dedans : vous choisissez les prestations, l''outil calcule, vérifie la marge et met le devis en page à vos couleurs. Vous relisez, vous envoyez. Sans réponse, le client est relancé automatiquement.'
    en: 'We build quoting tools for tradespeople, installers and service businesses. Your prices, margins and options are already in it: you pick the items, the tool does the maths, checks the margin and lays the quote out in your brand. You proofread, you send. If there''s no answer, the customer gets an automatic reminder.'
    pt: 'Construímos ferramentas de orçamento para prestadores de serviço, instaladores e empresas de serviços. Seus preços, suas margens e suas opções já estão lá dentro: você escolhe os serviços, a ferramenta calcula, confere a margem e diagrama o orçamento com a sua identidade visual. Você revisa e envia. Sem resposta, o cliente recebe um lembrete automático.'
  ucVisualAriaLabel:
    fr: 'Exemple d''écran : un devis en cours de création, avec le catalogue de prestations, le calcul de la marge et l''aperçu du document envoyé au client'
    en: 'Example screen: a quote being built, with the item catalogue, the margin check and a preview of the document sent to the customer'
    pt: 'Exemplo de tela: um orçamento em criação, com o catálogo de serviços, o cálculo da margem e a prévia do documento enviado ao cliente'
  qtFigureQtAriaLabel:
    fr: 'Exemple d''écran : un devis en cours de création, avec le catalogue de prestations, le calcul de la marge et l''aperçu du document envoyé au client'
