strings:
  title:
    fr: Lecture de documents
    en: Document reading
    pt: Leitura de documentos
  description:
    fr: L'IA extrait les informations, les range au bon endroit et signale ce qui semble anormal.
    en: AI pulls out the information, files it in the right place and flags anything that looks off.
    pt: A IA extrai as informações, coloca cada uma no lugar certo e sinaliza o que parece anormal.
  uc:
    fr: Une IA qui lit vos documents, <span>et remplit les bonnes cases.</span>
    en: AI that reads your documents, <span>and fills in the right fields.</span>
    pt: Uma IA que lê os seus documentos, <span>e preenche os campos certos.</span>
  ucLede:
    fr: 'Nous construisons des outils qui lisent pour vous les factures fournisseurs, les bons de commande et les formulaires, qu''ils arrivent par email ou en photo. L''IA extrait les informations, les range au bon endroit et signale ce qui semble anormal. Vous vérifiez, vous validez : la saisie à la main disparaît.'
    en: 'We build tools that read supplier invoices, purchase orders and forms for you, whether they arrive by email or as a photo. AI pulls out the information, files it in the right place and flags anything that looks off. You check, you approve: manual data entry disappears.'
    pt: 'Construímos ferramentas que leem por você as faturas de fornecedores, os pedidos de compra e os formulários, cheguem eles por e-mail ou em foto. A IA extrai as informações, coloca cada uma no lugar certo e sinaliza o que parece anormal. Você confere e aprova: a digitação manual desaparece.'
