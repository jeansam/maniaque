    fr: "Exemple : un projet qui dérive, repéré à mi-parcours."
    en: "Example: a project going over, caught halfway through."
    pt: "Exemplo: um projeto com desvio, identificado no meio do caminho."
  audit:
    fr: Dites-nous comment vous suivez vos projets aujourd'hui.
    en: Tell us how you track your projects today.
    pt: Conte para nós como você acompanha os seus projetos hoje.
