order: 10
slug:
  fr: propositions-commerciales
  en: sales-proposals
  pt: propostas-comerciais
quote:
  fr: «&nbsp;Chaque proposition repart d'un vieux fichier Word.&nbsp;»
  en: “Every proposal starts from an old Word file.”
  pt: “Cada proposta começa de um arquivo Word antigo.”
summary:
  fr: L'IA rédige un premier jet à partir de vos propositions passées, mis en page à votre image. Il ne vous reste qu'à relire.
  en: AI drafts a first version from your past proposals, laid out in your brand. All that's left is to proofread.
  pt: A IA escreve um primeiro rascunho a partir das suas propostas anteriores, diagramado com a sua identidade. Só falta revisar.
strings:
  title:
    fr: Propositions commerciales
    en: Sales proposals
    pt: Propostas comerciais
  description:
    fr: L'IA lit le besoin du client et rédige un premier jet à partir de vos propositions passées, de vos références et de vos CV.
    en: AI reads the client's brief and drafts a first version from your past proposals, references and CVs.
    pt: A IA lê a necessidade do cliente e escreve um primeiro rascunho a partir das suas propostas anteriores, das suas referências e dos seus currículos.
  headline:
    fr: Des propositions commerciales rédigées en minutes, <span>et mises en page à votre image.</span>
    en: Sales proposals drafted in minutes, <span>and laid out in your brand.</span>
    pt: Propostas comerciais escritas em minutos, <span>e diagramadas com a sua identidade.</span>
  lede:
    fr: Nous construisons des outils de propositions pour les cabinets de conseil, les agences et les entreprises de services. L'IA lit le besoin du client et rédige un premier jet à partir de vos propositions passées, de vos références et de vos CV. Le document sort dans votre propre modèle. Vous relisez, vous fixez le prix, et vous envoyez.
    en: We build proposal tools for consultancies, agencies and service businesses. AI reads the client's brief and drafts a first version from your past proposals, references and CVs. The document comes out in your own template. You proofread, set the price, and send.
    pt: Construímos ferramentas de propostas para consultorias, agências e empresas de serviços. A IA lê a necessidade do cliente e escreve um primeiro rascunho a partir das suas propostas anteriores, das suas referências e dos seus currículos. O documento sai no seu próprio modelo. Você revisa, define o preço e envia.
  appClass: qt-app
  caption:
    fr: "Exemple : un cahier des charges reçu, une proposition prête à relire."
    en: "Example: a brief received, a proposal ready to review."
    pt: "Exemplo: um termo de referência recebido, uma proposta pronta para revisar."
  audit:
    fr: Dites-nous comment vous rédigez vos propositions aujourd'hui.
    en: Tell us how you write proposals today.
    pt: Conte para nós como você escreve as suas propostas hoje.
