order: 12
slug:
  fr: support-client
  en: customer-support
  pt: suporte-ao-cliente
strings:
  title:
    fr: Support client
    en: Customer support
    pt: Suporte ao cliente
  description:
    fr: Chaque demande est classée, attribuée à la bonne personne et accompagnée d'un brouillon de réponse rédigé par l'IA à partir de vos réponses passées.
    en: Every request is sorted, assigned to the right person and comes with a draft reply written by AI from your past answers.
    pt: Cada pedido é classificado, atribuído à pessoa certa e acompanhado de um rascunho de resposta escrito pela IA a partir das suas respostas anteriores.
  uc:
    fr: Un support client qui trie la boîte mail, <span>et prépare les réponses.</span>
    en: Customer support that sorts the inbox, <span>and drafts the replies.</span>
    pt: Um suporte ao cliente que organiza a caixa de e-mail, <span>e prepara as respostas.</span>
  ucLede:
    fr: Nous construisons des outils de support pour les équipes débordées par les emails. Chaque demande est classée, attribuée à la bonne personne et accompagnée d'un brouillon de réponse rédigé par l'IA à partir de vos réponses passées. Votre équipe relit et envoie. Vos clients ont une réponse plus vite, et rien ne se perd.
    en: We build support tools for teams swamped by email. Every request is sorted, assigned to the right person and comes with a draft reply written by AI from your past answers. Your team reviews and sends. Customers hear back faster, and nothing slips through.
    pt: Construímos ferramentas de suporte para equipes sobrecarregadas de e-mails. Cada pedido é classificado, atribuído à pessoa certa e acompanhado de um rascunho de resposta escrito pela IA a partir das suas respostas anteriores. A sua equipe revisa e envia. Seus clientes recebem resposta mais rápido, e nada se perde.
  ucVisualAriaLabel:
    fr: 'Exemple d''écran : support client'
    en: 'Example screen: customer support'
    pt: 'Exemplo de tela: suporte ao cliente'
  qtFigureQtAriaLabel:
