    en: 'Example screen: customer support'
    pt: 'Exemplo de tela: suporte ao cliente'
  qtAppClass: qt-app qt-app-2
  qtFigureFigcaption:
    fr: 'Exemple : une demande urgente, triée et déjà accompagnée de sa réponse.'
    en: 'Example: an urgent request, sorted and already paired with a reply.'
    pt: 'Exemplo: um pedido urgente, classificado e já acompanhado da resposta.'
  audit:
    fr: Dites-nous comment vous gérez les demandes de vos clients aujourd'hui.
    en: Tell us how you handle customer requests today.
    pt: Conte para nós como você lida hoje com os pedidos dos seus clientes.
