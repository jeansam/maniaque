strings:
  title:
    fr: Arrivée d'un client
    en: New client setup
    pt: Novo cliente
  description:
    fr: Le client remplit un seul formulaire, dépose ses documents et signe en ligne.
    en: The client fills in one form, uploads their documents and signs online.
    pt: O cliente preenche um único formulário, envia os documentos e assina online.
  uc:
    fr: Un nouveau client lancé en une journée, <span>sans rien ressaisir.</span>
    en: A new client up and running in a day, <span>with nothing typed twice.</span>
    pt: Um novo cliente ativo em um dia, <span>sem redigitar nada.</span>
  ucLede:
    fr: Nous construisons des parcours d'arrivée client pour les entreprises qui recopient les mêmes informations dans plusieurs logiciels. Le client remplit un seul formulaire, dépose ses documents et signe en ligne. L'outil crée sa fiche partout où il le faut et prépare son dossier. Vous suivez chaque arrivée, étape par étape.
    en: We build client onboarding flows for businesses that type the same details into several systems. The client fills in one form, uploads their documents and signs online. The tool creates their record everywhere it's needed and prepares their file. You follow each new client, step by step.
    pt: Construímos jornadas de entrada de clientes para empresas que copiam as mesmas informações em vários sistemas. O cliente preenche um único formulário, envia os documentos e assina online. A ferramenta cria o cadastro dele em todos os lugares necessários e prepara a pasta. Você acompanha cada entrada, etapa por etapa.
