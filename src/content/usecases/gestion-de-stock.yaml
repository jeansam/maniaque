    pt: 'Exemplo: os itens que merecem atenção, e o pedido ao fornecedor já pronto.'
  audit:
    fr: Dites-nous comment vous suivez votre stock aujourd'hui.
    en: Tell us how you track your stock today.
    pt: Conte para nós como você acompanha o seu estoque hoje.
