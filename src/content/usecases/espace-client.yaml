    fr: "Exemple : ce que voit votre client en se connectant."
    en: "Example: what your customer sees when they log in."
    pt: "Exemplo: o que o seu cliente vê ao entrar."
  audit:
    fr: Dites-nous ce que vos clients vous demandent le plus souvent.
    en: Tell us what your customers ask you most often.
    pt: Conte para nós o que os seus clientes mais perguntam.
