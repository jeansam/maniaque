    en: "Example screen: contracts and deadlines"
    pt: "Exemplo de tela: contratos e prazos"
  qtAppClass: qt-app
  qtFigureFigcaption:
    fr: "Exemple : une reconduction de trois ans évitée, sept jours avant la fin du préavis."
    en: "Example: a three-year renewal avoided, seven days before the notice deadline."
    pt: "Exemplo: uma renovação de três anos evitada, sete dias antes do fim do aviso prévio."
  audit:
    fr: Dites-nous comment vous suivez vos contrats aujourd'hui.
    en: Tell us how you keep track of contracts today.
    pt: Conte para nós como você acompanha os seus contratos hoje.
