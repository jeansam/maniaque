order: 13
slug:
  fr: contrats-et-echeances
  en: contracts-and-deadlines
  pt: contratos-e-prazos
quote:
  fr: «&nbsp;Le contrat s'est encore renouvelé tout seul.&nbsp;»
  en: “The contract renewed itself again.”
  pt: “O contrato renovou sozinho de novo.”
summary:
  fr: Chaque contrat avec ses dates clés. Vous êtes prévenu à temps pour renégocier ou résilier.
  en: Every contract with its key dates. You're warned in time to renegotiate or cancel.
  pt: Cada contrato com as suas datas-chave. Você é avisado a tempo de renegociar ou cancelar.
strings:
  title:
    fr: Contrats et échéances
    en: Contracts and deadlines
    pt: Contratos e prazos
  description:
    fr: Chaque contrat est enregistré avec ses dates, son montant et son préavis.
    en: Each contract is stored with its dates, amount and notice period.
    pt: Cada contrato é registrado com as suas datas, o seu valor e o seu aviso prévio.
  uc:
    fr: Chaque contrat avec ses dates clés, <span>et une alerte avant chaque échéance.</span>
    en: Every contract with its key dates, <span>and an alert before each deadline.</span>
    pt: Cada contrato com as suas datas-chave, <span>e um alerta antes de cada prazo.</span>
  ucLede:
    fr: Nous construisons des outils de suivi de contrats pour les entreprises qui gèrent des fournisseurs, des locations, des abonnements ou des contrats de maintenance. Chaque contrat est enregistré avec ses dates, son montant et son préavis. Vous êtes prévenu à temps pour renégocier ou résilier, au lieu de subir une reconduction.
    en: We build contract tracking tools for businesses juggling suppliers, leases, subscriptions or maintenance contracts. Each contract is stored with its dates, amount and notice period. You're warned in time to renegotiate or cancel, instead of being caught by an automatic renewal.
    pt: Construímos ferramentas de gestão de contratos para empresas que lidam com fornecedores, locações, assinaturas ou contratos de manutenção. Cada contrato é registrado com as suas datas, o seu valor e o seu aviso prévio. Você é avisado a tempo de renegociar ou cancelar, em vez de engolir uma renovação automática.
  ucVisualAriaLabel:
    fr: "Exemple d'écran : contrats et échéances"
    en: "Example screen: contracts and deadlines"
    pt: "Exemplo de tela: contratos e prazos"
  qtFigureQtAriaLabel:
