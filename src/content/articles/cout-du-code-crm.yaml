slug:
  fr: cout-du-code-crm
  en: cost-of-code-crm
  pt: custo-do-codigo-crm
date: "2026-10-23"
minutes: 7
summary:
  fr: Ce qu'une agence demandait pour un CRM de base, hier en code, puis en no-code, et aujourd'hui avec l'IA. Chiffres sourcés, et ce qui ne baisse pas.
  en: What an agency charged for a basic CRM, first in code, then in no-code, and now with AI. Sourced figures, and what doesn't get cheaper.
  pt: O que uma agência cobrava por um CRM básico, antes em código, depois em no-code e hoje com IA. Números com fontes, e o que não fica mais barato.
strings:
  title:
    fr: "Le coût du code : un CRM sur mesure en code, en no-code et avec l'IA"
    en: "The cost of code: a custom CRM in code, in no-code and with AI"
    pt: "O custo do código: um CRM sob medida em código, em no-code e com IA"
  description:
    fr: "Combien une agence demande pour un CRM de base sur mesure : en code traditionnel, en no-code, et aujourd'hui avec l'IA. Chiffres sourcés, et ce qui ne baisse pas."
    en: "What an agency charges for a basic custom CRM: in traditional code, in no-code, and now with AI. Sourced figures, and what doesn't get cheaper."
    pt: "Quanto uma agência cobra por um CRM básico sob medida: em código tradicional, em no-code e hoje com IA. Números com fontes, e o que não fica mais barato."
  ogDescription:
    fr: "De 30 000 € à quelques milliers d'euros : comment le prix d'un CRM sur mesure a changé, et ce que vous payez vraiment aujourd'hui."
    en: "From €30,000 to a few thousand euros: how the price of a custom CRM has changed, and what you're really paying for today."
    pt: "De R$\_180 mil a algumas dezenas de milhares de reais: como o preço de um CRM sob medida mudou, e o que você realmente paga hoje."
  imageAlt:
    fr: "Graphique en barres du prix demandé par une agence pour un CRM de base sur mesure : 25 000 à 40 000 euros en code traditionnel, 5 000 à 15 000 euros en no-code, 2 500 à 5 000 euros en code avec l'IA."
    en: "Bar chart of what an agency charges for a basic custom CRM: €25,000 to €40,000 in traditional code, €5,000 to €15,000 in no-code, €2,500 to €5,000 in code with AI."
    pt: "Gráfico de barras do preço cobrado por uma agência por um CRM básico sob medida: de 150 mil a 240 mil reais em código tradicional, de 30 mil a 90 mil reais em no-code, de 15 mil a 30 mil reais em código com IA."
  imageCaption:
    fr: Le prix d'une première version de CRM sur mesure, selon la façon de le construire. Ordres de grandeur.
    en: The price of a first version of a custom CRM, depending on how it's built. Rough figures.
    pt: "O preço de uma primeira versão de CRM sob medida, conforme a forma de construí-lo. Ordens de grandeza, convertidas de euros a cerca de R$\_6 por euro."
  lede:
    fr: Pendant longtemps, un logiciel sur mesure était un luxe de grande entreprise. Une PME qui voulait son propre CRM recevait un devis à cinq chiffres et retournait à ses tableurs. En dix ans, le prix d'une même première version a été divisé par dix. Voici comment, chiffres à l'appui, et ce qui, en revanche, n'a pas baissé.
    en: For a long time, custom software was a big-company luxury. A small business that wanted its own CRM got a five-figure quote and went back to its spreadsheets. In ten years, the price of the same first version has dropped tenfold. Here is how, with figures, and what hasn't got any cheaper.
    pt: Por muito tempo, software sob medida foi um luxo de grande empresa. Uma PME que queria o próprio CRM recebia um orçamento de cinco dígitos e voltava para as suas planilhas. Em dez anos, o preço de uma mesma primeira versão caiu para um décimo. Veja como, com números, e o que, por outro lado, não ficou mais barato.
