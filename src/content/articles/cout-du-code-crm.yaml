  h26:
    fr: Ce qui ne baisse pas
    en: What doesn't get cheaper
    pt: O que não fica mais barato
  p16:
    fr: 'Si écrire du code ne coûte presque plus rien, pourquoi un CRM ne coûte-t-il pas 25 dollars par mois sur Lovable ? Parce que le code n''a jamais été la partie difficile. Trois choses gardent leur prix :'
    en: 'If writing code costs next to nothing, why doesn''t a CRM cost $25 a month on Lovable? Because code was never the hard part. Three things keep their price:'
    pt: 'Se escrever código quase não custa mais nada, por que um CRM não custa 25 dólares por mês no Lovable? Porque o código nunca foi a parte difícil. Três coisas mantêm o seu preço:'
  li8:
    fr: <strong>comprendre votre besoin.</strong> Savoir que vos commerciaux ne remplissent jamais le champ « source », que tel client a deux adresses de facturation, que la relance doit partir le mardi. L'IA construit ce qu'on lui décrit. Encore faut-il le décrire juste ;
    en: <strong>understanding your need.</strong> Knowing that your salespeople never fill in the "source" field, that one client has two billing addresses, that follow-ups must go out on Tuesdays. AI builds what you describe to it. You still have to describe it right;
    pt: <strong>entender a sua necessidade.</strong> Saber que os seus vendedores nunca preenchem o campo “origem”, que tal cliente tem dois endereços de cobrança, que o follow-up precisa sair na terça-feira. A IA constrói o que lhe descrevem. Ainda é preciso descrever direito;
  li9:
    fr: <strong>les décisions techniques.</strong> Où sont stockées vos données, qui y a accès, comment on les sauvegarde, comment l'outil évoluera dans deux ans. Un code généré sans relecture fonctionne souvent en démonstration et casse en production ;
    en: <strong>technical decisions.</strong> Where your data is stored, who can access it, how it's backed up, how the tool will evolve in two years. Code generated without review often works in a demo and breaks in production;
    pt: <strong>as decisões técnicas.</strong> Onde ficam os seus dados, quem tem acesso, como é feito o backup, como a ferramenta vai evoluir em dois anos. Um código gerado sem revisão costuma funcionar na demonstração e quebrar em produção;
  li10:
    fr: <strong>la vie de l'outil.</strong> Un logiciel utilisé tous les jours appelle des corrections, des ajustements et des nouvelles demandes. Les guides du secteur comptent chaque année <a href="https://www.magram.fr/blog/prix-crm-combien-coute-un-logiciel-crm" target="_blank" rel="noopener">5 à 10&nbsp;% du coût de développement</a> rien que pour la maintenance.
    en: <strong>the life of the tool.</strong> Software used every day needs fixes, adjustments and new requests. Industry guides budget <a href="https://www.magram.fr/blog/prix-crm-combien-coute-un-logiciel-crm" target="_blank" rel="noopener">5 to 10% of the development cost</a> each year for maintenance alone.
    pt: <strong>a vida da ferramenta.</strong> Um software usado todos os dias pede correções, ajustes e novos pedidos. Os guias do setor contam, todo ano, <a href="https://www.magram.fr/blog/prix-crm-combien-coute-un-logiciel-crm" target="_blank" rel="noopener">de 5 a 10% do custo de desenvolvimento</a> só para a manutenção.
  p17:
    fr: 'Autrement dit, la facture se déplace. Hier, vous payiez surtout des heures de frappe. Aujourd''hui, vous payez surtout du jugement : quelqu''un qui comprend votre métier, prend les bonnes décisions et reste là après la livraison.'
    en: 'In other words, the bill is shifting. Yesterday, you mostly paid for hours of typing. Today, you mostly pay for judgement: someone who understands your business, makes the right calls and is still there after delivery.'
    pt: 'Em outras palavras, a conta muda de lugar. Antes, você pagava sobretudo horas de digitação. Hoje, você paga sobretudo discernimento: alguém que entende o seu negócio, toma as decisões certas e continua presente depois da entrega.'
  h27:
    fr: Ce que ça change pour une PME
    en: What it changes for a small business
    pt: O que isso muda para uma PME
  p18:
    fr: 'La question n''est plus « avons-nous les moyens d''un outil sur mesure ? ». Pour la plupart des PME, la réponse est désormais oui. La vraie question devient : « qui va comprendre notre façon de travailler, et l''accompagner dans la durée ? ».'
    en: 'The question is no longer "can we afford custom software?". For most small businesses, the answer is now yes. The real question becomes: "who will understand the way we work, and stay with us over time?".'
    pt: 'A pergunta não é mais “temos condições de pagar por uma ferramenta sob medida?”. Para a maioria das PMEs, a resposta agora é sim. A verdadeira pergunta passa a ser: “quem vai entender a nossa forma de trabalhar e acompanhá-la ao longo do tempo?”.'
  p19:
    fr: C'est pour ça que notre modèle repose sur une première version à prix fixe, puis un abonnement mensuel qui couvre les évolutions, l'hébergement et la maintenance. Le coût du code a chuté, nous le répercutons. Le temps passé à comprendre votre entreprise, lui, reste le cœur du travail.
    en: That's why our model is a fixed-price first version, then a monthly subscription that covers changes, hosting and maintenance. The cost of code has dropped, and we pass that on. The time spent understanding your business remains the heart of the work.
    pt: É por isso que o nosso modelo se baseia em uma primeira versão a preço fixo, seguida de uma assinatura mensal que cobre as evoluções, a hospedagem e a manutenção. O custo do código despencou, e repassamos isso. O tempo dedicado a entender a sua empresa continua sendo o centro do trabalho.
  p20:
    fr: Si vous avez un CRM, un tableur ou un outil métier qui vous agace, <a data-book target="_blank" rel="noopener">réservez un audit gratuit de 45 minutes</a>. Vous saurez ce que coûterait votre outil aujourd'hui, et si ça vaut le coup.
    en: If you have a CRM, a spreadsheet or a business tool that bugs you, <a data-book target="_blank" rel="noopener">book a free 45-minute audit</a>. You'll find out what your tool would cost today, and whether it's worth it.
    pt: Se você tem um CRM, uma planilha ou uma ferramenta de trabalho que irrita você, <a data-book target="_blank" rel="noopener">agende um diagnóstico gratuito de 45 minutos</a>. Você vai saber quanto custaria a sua ferramenta hoje, e se vale a pena.
